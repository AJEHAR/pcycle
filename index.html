function CongratCardModal({ cardData, userName, onClose }) {
  const canvasRef = useRef(null);
  const [ready, setReady] = useState(false);
  const [downloading, setDownloading] = useState(false);
  const [designIdx, setDesignIdx] = useState(() => {
    // Rotation berdasarkan tahun + hash nama
    const seed = (parseInt(cardData.tahun) || 0) + (userName || '').length;
    return seed % 5;
  });

  const nama = userName || 'Muslimah';
  const DESIGNS = [
    { name: 'Forest Night', emoji: '🌿' },
    { name: 'Royal Navy',   emoji: '⭐' },
    { name: 'Burgundy Dusk',emoji: '🌹' },
    { name: 'Violet Majesty',emoji:'💜' },
    { name: 'Pearl Dawn',   emoji: '🌸' },
  ];

  useEffect(() => {
    setReady(false);
    const t = setTimeout(() => { drawCard(designIdx); setReady(true); }, 120);
    return () => clearTimeout(t);
  }, [designIdx]);

  const nextDesign = () => setDesignIdx(i => (i + 1) % 5);
  const prevDesign = () => setDesignIdx(i => (i + 4) % 5);

  // ── SHARED HELPERS ─────────────────────────────────────────
  function star(ctx, cx, cy, r, color, alpha) {
    ctx.globalAlpha = alpha || 1;
    ctx.fillStyle = color;
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = (i * Math.PI) / 5 - Math.PI / 2;
      const rad = i % 2 === 0 ? r : r * 0.42;
      i === 0 ? ctx.moveTo(cx + rad*Math.cos(a), cy + rad*Math.sin(a))
              : ctx.lineTo(cx + rad*Math.cos(a), cy + rad*Math.sin(a));
    }
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
  }

  function star8(ctx, cx, cy, r, color) {
    ctx.fillStyle = color;
    for (let rot = 0; rot < 2; rot++) {
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot * Math.PI / 4);
      ctx.beginPath();
      for (let i = 0; i < 4; i++) {
        const a = (i * Math.PI) / 2;
        ctx.lineTo(r * Math.cos(a), r * Math.sin(a));
        const a2 = a + Math.PI / 4;
        ctx.lineTo(r * 0.38 * Math.cos(a2), r * 0.38 * Math.sin(a2));
      }
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }

  function diamond(ctx, cx, cy, s, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(cx, cy-s); ctx.lineTo(cx+s, cy);
    ctx.lineTo(cx, cy+s); ctx.lineTo(cx-s, cy);
    ctx.closePath(); ctx.fill();
  }

  function divLine(ctx, cx, cy, hw, color) {
    ctx.strokeStyle = color; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(cx-hw, cy); ctx.lineTo(cx-16, cy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx+16, cy); ctx.lineTo(cx+hw, cy); ctx.stroke();
    diamond(ctx, cx, cy, 7, color);
  }

  function footerText(ctx, W, H, nama, cardData, textColor) {
    const today = new Date();
    const months = ['Jan','Feb','Mac','Apr','Mei','Jun','Julai','Ogos','Sep','Okt','Nov','Dis'];
    const dateStr = today.getDate() + ' ' + months[today.getMonth()] + ' ' + today.getFullYear();
    ctx.fillStyle = textColor;
    ctx.font = '20px Arial, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(dateStr, W/2, H - 54);
    ctx.fillText('CycleTrack', W/2, H - 30);
  }

  function centralInfo(ctx, W, totalGanti, tahun, bigColor, smallColor, unitColor) {
    // Big number
    ctx.fillStyle = bigColor;
    ctx.font = 'bold 210px Georgia, serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.shadowColor = bigColor; ctx.shadowBlur = 40;
    ctx.fillText(String(totalGanti), W/2, 760);
    ctx.shadowBlur = 0;
    // HARI
    ctx.fillStyle = unitColor;
    ctx.font = '500 42px Arial, sans-serif';
    ctx.textBaseline = 'middle';
    ctx.fillText('H  A  R  I', W/2, 800);
    // Tahun
    ctx.fillStyle = smallColor;
    ctx.font = '24px Arial, sans-serif';
    const tahunLabel = tahun && tahun !== 'Semua' ? 'Ramadan ' + tahun : 'Semua Tahun Selesai';
    ctx.fillText(tahunLabel, W/2, 848);
  }

  function titleBlock(ctx, W, mainText, nama, mainColor, namaColor) {
    ctx.fillStyle = mainColor;
    ctx.font = 'bold 72px Georgia, serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = mainColor; ctx.shadowBlur = 28;
    ctx.fillText(mainText, W/2, 416);
    ctx.shadowBlur = 0;
    ctx.fillStyle = namaColor;
    ctx.font = '28px Arial, sans-serif';
    ctx.fillText('Tahniah, ' + nama + ' 🎉', W/2, 462);
  }

  // ── DESIGN 1: FOREST NIGHT ──────────────────────────────────
  function drawDesign1(ctx, W, H) {
    // Background
    const bg = ctx.createLinearGradient(0, 0, W, H);
    bg.addColorStop(0, '#0a1f12'); bg.addColorStop(0.5, '#122b1c'); bg.addColorStop(1, '#091510');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    const radial = ctx.createRadialGradient(W/2, H*0.42, 60, W/2, H*0.42, 500);
    radial.addColorStop(0, 'rgba(30,80,45,0.5)'); radial.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = radial; ctx.fillRect(0, 0, W, H);

    // Border
    ctx.strokeStyle = '#c9a84c'; ctx.lineWidth = 4;
    ctx.strokeRect(36, 36, W-72, H-72);
    ctx.strokeStyle = 'rgba(201,168,76,0.35)'; ctx.lineWidth = 1.5;
    ctx.strokeRect(50, 50, W-100, H-100);
    [[60,60],[W-60,60],[W-60,H-60],[60,H-60]].forEach(([x,y]) => {
      [14,26,38].forEach(r => {
        ctx.strokeStyle = 'rgba(201,168,76,0.45)'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.stroke();
      });
      ctx.fillStyle='#c9a84c'; ctx.beginPath(); ctx.arc(x,y,5,0,Math.PI*2); ctx.fill();
    });

    // Stars bg
    [[180,140,5],[890,115,4],[130,310,3.5],[950,290,3],[90,530,3],
     [980,500,4],[140,730,3],[960,720,3.5],[280,940,4.5],[820,950,3.5],
     [400,100,3],[720,95,2.5],[540,70,3]].forEach(([x,y,r]) =>
      star(ctx,x,y,r,'rgba(255,248,200,0.75)')
    );

    // Crescent moon

  // ── DESIGN 3: BURGUNDY DUSK ─────────────────────────────────
  function drawDesign3(ctx, W, H) {
    const bg=ctx.createLinearGradient(0,H,W,0);
    bg.addColorStop(0,'#1a0505'); bg.addColorStop(0.5,'#350c0c'); bg.addColorStop(1,'#200808');
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
    const radial=ctx.createRadialGradient(W/2,H*0.45,80,W/2,H*0.45,540);
    radial.addColorStop(0,'rgba(100,20,20,0.5)'); radial.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=radial; ctx.fillRect(0,0,W,H);

    // Outer thick gold border
    ctx.strokeStyle='#b8860b'; ctx.lineWidth=5;
    ctx.strokeRect(32,32,W-64,H-64);
    ctx.strokeStyle='rgba(184,134,11,0.4)'; ctx.lineWidth=1.5;
    ctx.strokeRect(50,50,W-100,H-100);
    ctx.strokeStyle='rgba(184,134,11,0.2)'; ctx.lineWidth=1;
    ctx.strokeRect(62,62,W-124,H-124);

    // Rose/floral at corners — draw petals
    function rose(ctx, cx, cy, s) {
      const petals = 8, r=s;
      ctx.save(); ctx.translate(cx, cy);
      for(let i=0;i<petals;i++) {
        ctx.save(); ctx.rotate((i/petals)*Math.PI*2);
        ctx.fillStyle = i%2===0 ? 'rgba(200,120,50,0.55)' : 'rgba(184,134,11,0.45)';
        ctx.beginPath();
        ctx.ellipse(0,-r*0.55,r*0.22,r*0.52,0,0,Math.PI*2);
        ctx.fill(); ctx.restore();
      }
      ctx.fillStyle='rgba(220,160,50,0.8)';
      ctx.beginPath(); ctx.arc(0,0,s*0.25,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }
    [[68,68],[W-68,68],[W-68,H-68],[68,H-68]].forEach(([x,y])=>rose(ctx,x,y,36));

    // Arch at top
    const archCx=W/2, archTop=72, archR=130;
    ctx.strokeStyle='rgba(184,134,11,0.5)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(archCx, archTop+archR, archR, Math.PI*1.1, Math.PI*1.9); ctx.stroke();
    ctx.strokeStyle='rgba(184,134,11,0.3)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(archCx, archTop+archR+12, archR-14, Math.PI*1.12, Math.PI*1.88); ctx.stroke();

    // Crescent inside arch — smaller
    const mcx=W/2, mcy=175, mr=58;
    const mglow=ctx.createRadialGradient(mcx,mcy,8,mcx,mcy,mr*2);
    mglow.addColorStop(0,'rgba(220,140,40,0.25)'); mglow.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=mglow; ctx.beginPath(); ctx.arc(mcx,mcy,mr*2,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#d4a040'; ctx.beginPath(); ctx.arc(mcx,mcy,mr,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#1a0505'; ctx.beginPath(); ctx.arc(mcx+22,mcy-8,mr*0.78,0,Math.PI*2); ctx.fill();

    // Stars
    [[160,120,4,'rgba(255,220,130,0.6)'],[895,115,3.5,'rgba(255,220,130,0.6)'],
     [110,350,3,'rgba(255,200,100,0.5)'],[970,330,2.5,'rgba(255,200,100,0.5)'],
     [130,700,3,'rgba(255,200,100,0.45)'],[945,710,3,'rgba(255,200,100,0.45)'],
     [300,958,4,'rgba(255,220,130,0.5)'],[790,962,3.5,'rgba(255,220,130,0.5)']
    ].forEach(([x,y,r,c])=>star(ctx,x,y,r,c));

    // Bismillah
    ctx.fillStyle='rgba(255,225,160,0.85)'; ctx.font='34px serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيم', W/2, 318);
    divLine(ctx,W/2,349,240,'rgba(184,134,11,0.55)');

    titleBlock(ctx,W,'Subhanallah!',nama,'#fff0d0','rgba(212,160,64,0.95)');
    divLine(ctx,W/2,496,190,'rgba(184,134,11,0.5)');

    ctx.fillStyle='rgba(255,225,175,0.72)'; ctx.font='26px Arial,sans-serif';
    ctx.fillText('Telah berjaya menyelesaikan', W/2, 534);
    ctx.fillText('hutang puasa ganti', W/2, 567);

    centralInfo(ctx,W,cardData.totalGanti,cardData.tahun,'#d4a040','rgba(255,210,140,0.42)','#ffe0b0');

    // Floral divider bottom
    const dy=876;
    ctx.strokeStyle='rgba(184,134,11,0.45)'; ctx.lineWidth=1.5;
    ctx.beginPath();
    for(let dx=-200;dx<=200;dx+=20) {
      ctx.arc(W/2+dx, dy+(dx%40===0?0:4), 4, 0, Math.PI*2);
    }
    ctx.stroke();
    diamond(ctx,W/2,dy,8,'rgba(212,160,64,0.9)');

    ctx.fillStyle='rgba(212,160,64,0.88)'; ctx.font='50px serif';
    ctx.fillText('سُبْحَانَ اللَّهِ', W/2, 930);
    footerText(ctx,W,H,nama,cardData,'rgba(255,200,140,0.28)');
  }

  // ── DESIGN 4: VIOLET MAJESTY ────────────────────────────────
  function drawDesign4(ctx, W, H) {
    const bg=ctx.createLinearGradient(W,0,0,H);
    bg.addColorStop(0,'#0c0620'); bg.addColorStop(0.5,'#180a38'); bg.addColorStop(1,'#080416');
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
    const radial=ctx.createRadialGradient(W/2,H/2,60,W/2,H/2,560);
    radial.addColorStop(0,'rgba(80,20,140,0.42)'); radial.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=radial; ctx.fillRect(0,0,W,H);

    // Hexagonal bg pattern (subtle)
    ctx.save();
    const hexR=46, hexW=hexR*Math.sqrt(3), hexH=hexR*2;
    for(let row=-1;row<H/hexH+1;row++) {
      for(let col=-1;col<W/hexW+1;col++) {
        const hx=col*hexW+(row%2)*hexW/2;
        const hy=row*hexH*0.75;
        ctx.strokeStyle='rgba(140,80,220,0.1)'; ctx.lineWidth=1;
        ctx.beginPath();
        for(let i=0;i<6;i++) {
          const a=i*Math.PI/3-Math.PI/6;
          i===0?ctx.moveTo(hx+hexR*Math.cos(a),hy+hexR*Math.sin(a))
               :ctx.lineTo(hx+hexR*Math.cos(a),hy+hexR*Math.sin(a));
        }
        ctx.closePath(); ctx.stroke();
      }
    }
    ctx.restore();

    // Bold geometric border — diamond corner style
    const m=38;
    ctx.strokeStyle='rgba(180,130,255,0.6)'; ctx.lineWidth=3;
    ctx.strokeRect(m,m,W-m*2,H-m*2);
    ctx.strokeStyle='rgba(201,168,76,0.5)'; ctx.lineWidth=1.5;
    ctx.strokeRect(m+16,m+16,W-(m+16)*2,H-(m+16)*2);
    [[m,m],[W-m,m],[W-m,H-m],[m,H-m]].forEach(([x,y]) => {
      ctx.fillStyle='rgba(180,130,255,0.5)';
      ctx.beginPath(); ctx.arc(x,y,8,0,Math.PI*2); ctx.fill();
      diamond(ctx,x,y,14,'rgba(201,168,76,0.7)');
    });

    // Geometric mandala at top
    const mcx=W/2, mcy=195, mr=88;
    // Rings
    [mr*1.6,mr*1.3,mr*1.0,mr*0.7].forEach((r,i) => {
      ctx.strokeStyle=`rgba(${180-i*20},${100+i*20},255,${0.18-i*0.02})`;
      ctx.lineWidth=1; ctx.beginPath(); ctx.arc(mcx,mcy,r,0,Math.PI*2); ctx.stroke();
    });
    // 12 lines radiating
    for(let i=0;i<12;i++) {
      const a=i*Math.PI/6;
      ctx.strokeStyle=`rgba(180,130,255,${i%3===0?0.45:0.15})`; ctx.lineWidth=i%3===0?1.5:1;
      ctx.beginPath(); ctx.moveTo(mcx+20*Math.cos(a),mcy+20*Math.sin(a));
      ctx.lineTo(mcx+mr*Math.cos(a),mcy+mr*Math.sin(a)); ctx.stroke();
    }
    // Center star8
    star8(ctx,mcx,mcy,mr*0.55,'rgba(201,168,76,0.75)');
    star8(ctx,mcx,mcy,mr*0.28,'rgba(230,190,255,0.85)');
    ctx.fillStyle='rgba(201,168,76,0.95)';
    ctx.beginPath(); ctx.arc(mcx,mcy,10,0,Math.PI*2); ctx.fill();
    // Outer ring dots
    for(let i=0;i<16;i++) {
      const a=i*Math.PI/8;
      star(ctx,mcx+mr*1.1*Math.cos(a),mcy+mr*1.1*Math.sin(a),3,'rgba(201,168,76,0.6)');
    }

    // Bismillah
    ctx.fillStyle='rgba(200,170,255,0.85)'; ctx.font='34px serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيم', W/2, 318);
    // Polygon divider
    const py=349;
    for(let dx=-200;dx<=200;dx+=24) { if(Math.abs(dx)<14)continue; diamond(ctx,W/2+dx,py,4,'rgba(180,130,255,0.35)'); }
    diamond(ctx,W/2,py,8,'rgba(201,168,76,0.9)');

    // Title — TAHNIAH bold large
    ctx.fillStyle='#f0e0ff';
    ctx.font='bold 86px Georgia,serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.shadowColor='rgba(180,130,255,0.5)'; ctx.shadowBlur=35;
    ctx.fillText('TAHNIAH!', W/2, 416);
    ctx.shadowBlur=0;
    ctx.fillStyle='rgba(201,168,76,0.9)'; ctx.font='28px Arial,sans-serif';
    ctx.fillText('Tahniah, ' + nama + ' 🎉', W/2, 462);

    // Geo divider
    for(let dx=-190;dx<=190;dx+=24) { if(Math.abs(dx)<14)continue; diamond(ctx,W/2+dx,496,4,'rgba(180,130,255,0.3)'); }
    diamond(ctx,W/2,496,8,'rgba(201,168,76,0.85)');

    ctx.fillStyle='rgba(210,185,255,0.72)'; ctx.font='26px Arial,sans-serif';
    ctx.fillText('Telah berjaya menyelesaikan', W/2, 534);
    ctx.fillText('hutang puasa ganti', W/2, 567);

    centralInfo(ctx,W,cardData.totalGanti,cardData.tahun,'rgba(201,168,76,0.95)','rgba(200,170,255,0.42)','#e0d0ff');

    for(let dx=-200;dx<=200;dx+=24) { if(Math.abs(dx)<14)continue; diamond(ctx,W/2+dx,876,4,'rgba(180,130,255,0.35)'); }
    diamond(ctx,W/2,876,8,'rgba(201,168,76,0.88)');

    ctx.fillStyle='rgba(201,168,76,0.88)'; ctx.font='50px serif';
    ctx.fillText('ٱلْحَمْدُ لِلَّٰهِ', W/2, 930);
    footerText(ctx,W,H,nama,cardData,'rgba(200,170,255,0.28)');
  }

  // ── DESIGN 5: PEARL DAWN ────────────────────────────────────
  function drawDesign5(ctx, W, H) {
    // Light background
    const bg=ctx.createLinearGradient(0,0,W,H);
    bg.addColorStop(0,'#fdf8ef'); bg.addColorStop(0.5,'#fff9f2'); bg.addColorStop(1,'#f5ede0');
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
    const radial=ctx.createRadialGradient(W/2,H*0.45,60,W/2,H*0.45,520);
    radial.addColorStop(0,'rgba(240,220,160,0.35)'); radial.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=radial; ctx.fillRect(0,0,W,H);

    // Elegant thin border
    ctx.strokeStyle='rgba(180,140,60,0.6)'; ctx.lineWidth=2.5;
    ctx.strokeRect(34,34,W-68,H-68);
    ctx.strokeStyle='rgba(180,140,60,0.25)'; ctx.lineWidth=1;
    ctx.strokeRect(46,46,W-92,H-92);

    // Delicate floral corners
    function floralCorner(ctx,cx,cy,flip) {
      ctx.save(); ctx.translate(cx,cy);
      if(flip&1) ctx.scale(-1,1); if(flip&2) ctx.scale(1,-1);
      // Stem
      ctx.strokeStyle='rgba(120,160,80,0.6)'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(0,0); ctx.bezierCurveTo(20,-15,40,-10,55,-30);
      ctx.bezierCurveTo(30,-5,10,-20,0,0); ctx.stroke();
      // Leaves
      [[20,-18,12],[38,-22,10],[10,-30,9]].forEach(([lx,ly,ls]) => {
        ctx.fillStyle='rgba(100,150,70,0.45)';
        ctx.beginPath(); ctx.ellipse(lx,ly,ls,ls*0.45,-0.5,0,Math.PI*2); ctx.fill();
      });
      // Flowers
      [[55,-30,12],[32,-38,9],[18,-44,7]].forEach(([fx,fy,fr],fi) => {
        for(let p=0;p<5;p++) {
          const pa=p*Math.PI*2/5;
          ctx.fillStyle=fi===0?'rgba(220,80,100,0.5)':'rgba(240,140,160,0.45)';
          ctx.beginPath(); ctx.ellipse(fx+fr*0.55*Math.cos(pa),fy+fr*0.55*Math.sin(pa),fr*0.42,fr*0.28,pa,0,Math.PI*2);
          ctx.fill();
        }
        ctx.fillStyle='rgba(255,220,60,0.8)'; ctx.beginPath(); ctx.arc(fx,fy,fr*0.28,0,Math.PI*2); ctx.fill();
      });
      ctx.restore();
    }
    floralCorner(ctx,58,58,0); floralCorner(ctx,W-58,58,1);
    floralCorner(ctx,58,H-58,2); floralCorner(ctx,W-58,H-58,3);

    // Top ornament — gold open arch and crescent
    const acy=190;
    ctx.strokeStyle='rgba(180,140,60,0.4)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(W/2,acy+80,115,Math.PI*1.15,Math.PI*1.85); ctx.stroke();
    ctx.strokeStyle='rgba(180,140,60,0.2)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(W/2,acy+90,98,Math.PI*1.18,Math.PI*1.82); ctx.stroke();

    // Crescent — gold on light bg
    const mcx=W/2,mcy=acy,mr=60;
    const mglow=ctx.createRadialGradient(mcx,mcy,8,mcx,mcy,mr*2);
    mglow.addColorStop(0,'rgba(201,160,60,0.2)'); mglow.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=mglow; ctx.beginPath(); ctx.arc(mcx,mcy,mr*2,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#b8960c'; ctx.beginPath(); ctx.arc(mcx,mcy,mr,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fdf8ef'; ctx.beginPath(); ctx.arc(mcx+22,mcy-8,mr*0.78,0,Math.PI*2); ctx.fill();
    // Small stars near moon (gold on light)
    [[W/2-105,152,4],[W/2+110,138,3.5],[W/2+72,215,3]].forEach(([x,y,r]) =>
      star(ctx,x,y,r,'rgba(180,140,60,0.6)')
    );

    // Bismillah — dark green
    ctx.fillStyle='rgba(30,80,45,0.8)'; ctx.font='34px serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيم', W/2, 316);

    // Floral divider
    ctx.strokeStyle='rgba(180,140,60,0.4)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(W/2-200,348); ctx.lineTo(W/2-18,348); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W/2+18,348); ctx.lineTo(W/2+200,348); ctx.stroke();
    ctx.fillStyle='rgba(201,140,60,0.8)'; ctx.beginPath(); ctx.arc(W/2,348,5,0,Math.PI*2); ctx.fill();
    // Tiny petals on divider line
    [[-130,-110,-80,-60,-40],[130,110,80,60,40]].flat().forEach(dx => {
      ctx.fillStyle='rgba(220,80,100,0.3)';
      ctx.beginPath(); ctx.arc(W/2+dx,348,4,0,Math.PI*2); ctx.fill();
    });

    // Title — dark green on light
    ctx.fillStyle='#1a3d28';
    ctx.font='bold 74px Georgia,serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.shadowColor='rgba(30,80,45,0.15)'; ctx.shadowBlur=12;
    ctx.fillText('Alhamdulillah!', W/2, 416);
    ctx.shadowBlur=0;
    ctx.fillStyle='#b8960c'; ctx.font='28px Arial,sans-serif';
    ctx.fillText('Tahniah, ' + nama + ' 🎉', W/2, 462);

    // Floral divider 2
    ctx.strokeStyle='rgba(180,140,60,0.35)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(W/2-180,496); ctx.lineTo(W/2-14,496); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W/2+14,496); ctx.lineTo(W/2+180,496); ctx.stroke();
    ctx.fillStyle='rgba(201,140,60,0.75)'; ctx.beginPath(); ctx.arc(W/2,496,5,0,Math.PI*2); ctx.fill();

    ctx.fillStyle='rgba(40,60,35,0.68)'; ctx.font='26px Arial,sans-serif';
    ctx.fillText('Telah berjaya menyelesaikan', W/2, 534);
    ctx.fillText('hutang puasa ganti', W/2, 567);

    // Day number — dark on light
    ctx.fillStyle='#b8960c';
    ctx.font='bold 210px Georgia,serif';
    ctx.textAlign='center'; ctx.textBaseline='alphabetic';
    ctx.shadowColor='rgba(180,140,60,0.3)'; ctx.shadowBlur=30;
    ctx.fillText(String(cardData.totalGanti), W/2, 760);
    ctx.shadowBlur=0;
    ctx.fillStyle='#1a3d28'; ctx.font='500 42px Arial,sans-serif'; ctx.textBaseline='middle';
    ctx.fillText('H  A  R  I', W/2, 800);
    ctx.fillStyle='rgba(40,60,35,0.5)'; ctx.font='24px Arial,sans-serif';
    const tl=cardData.tahun&&cardData.tahun!=='Semua'?'Ramadan '+cardData.tahun:'Semua Tahun Selesai';
    ctx.fillText(tl, W/2, 848);

    // Bottom vine divider
    ctx.strokeStyle='rgba(100,150,70,0.4)'; ctx.lineWidth=1.5;
    ctx.beginPath();
    for(let dx=-200;dx<=200;dx+=8) {
      const vy=876+Math.sin(dx*0.12)*4;
      dx===-200?ctx.moveTo(W/2+dx,vy):ctx.lineTo(W/2+dx,vy);
    }
    ctx.stroke();
    ctx.fillStyle='rgba(220,80,100,0.5)';
    [-180,-120,-60,0,60,120,180].forEach(dx => {
      ctx.beginPath(); ctx.arc(W/2+dx, 876+Math.sin(dx*0.12)*4, 5, 0, Math.PI*2); ctx.fill();
    });

    ctx.fillStyle='#b8960c'; ctx.font='50px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('ٱلْحَمْدُ لِلَّٰهِ', W/2, 930);
    footerText(ctx,W,H,nama,cardData,'rgba(40,60,35,0.3)');
  }

  // ── MAIN DRAW DISPATCHER ────────────────────────────────────
  function drawCard(idx) {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const W=1080, H=1080;
    canvas.width=W; canvas.height=H;
    ctx.clearRect(0,0,W,H);
    [drawDesign1,drawDesign2,drawDesign3,drawDesign4,drawDesign5][idx](ctx,W,H);
  }

  const downloadCard = () => {
    setDownloading(true);
    const canvas = canvasRef.current;
    try {
      const link = document.createElement('a');
      const safeNama = (nama).replace(/[^a-zA-Z0-9]/g,'_');
      const dName = DESIGNS[designIdx].name.replace(/ /g,'-');
      link.download = 'puasa-ganti-' + (cardData.tahun||'selesai') + '-' + dName + '-' + safeNama + '.png';
      link.href = canvas.toDataURL('image/png', 1.0);
      document.body.appendChild(link); link.click(); document.body.removeChild(link);
    } catch(e) { console.error(e); }
    setTimeout(() => setDownloading(false), 1200);
  };

  const accentColors = ['#2d6b47','#1a3d6e','#6b2020','#3d1a6b','#2d5c1e'];

  return (
    <div className="overlay overlay-center" onClick={e=>e.target.classList.contains('overlay')&&onClose()}>
      <div style={{
        background:'var(--white)', borderRadius:'var(--radius)',
        padding:'20px', margin:'16px', width:'calc(100% - 32px)',
        maxWidth:'420px', maxHeight:'92vh', overflowY:'auto',
        animation:'popIn 0.25s cubic-bezier(0.34,1.56,0.64,1)'
      }}>
        {/* Header */}
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'14px'}}>
          <div style={{fontFamily:'DM Serif Display',fontSize:'20px',color:'var(--text)'}}>
            🎉 Kad Tahniah
          </div>
          <button onClick={onClose} style={{background:'var(--cream)',border:'none',borderRadius:'50%',width:'32px',height:'32px',cursor:'pointer',fontSize:'16px',color:'var(--text-muted)',display:'flex',alignItems:'center',justifyContent:'center'}}>✕</button>
        </div>

        {/* Design selector pills */}
        <div style={{display:'flex',gap:'6px',marginBottom:'14px',overflowX:'auto',scrollbarWidth:'none',paddingBottom:'2px'}}>
          {DESIGNS.map((d,i) => (
            <button key={i} onClick={()=>setDesignIdx(i)} style={{
              padding:'5px 12px', border:'none', borderRadius:'20px', cursor:'pointer',
              fontFamily:'DM Sans,sans-serif', fontSize:'12px', fontWeight:'600',
              whiteSpace:'nowrap', flexShrink:0, minHeight:'32px',
              background: designIdx===i ? accentColors[i] : 'var(--cream)',
              color: designIdx===i ? 'white' : 'var(--text-muted)',
              boxShadow: designIdx===i ? '0 2px 8px rgba(0,0,0,0.2)' : 'none',
              transition:'all 0.15s'
            }}>{d.emoji} {d.name}</button>
          ))}
        </div>

        {/* Stats */}
        <div style={{background:'var(--green-light)',borderRadius:'var(--radius-sm)',padding:'10px 14px',marginBottom:'12px',display:'flex',alignItems:'center',gap:'10px'}}>
          <span style={{fontSize:'22px'}}>✅</span>
          <div>
            <div style={{fontFamily:'DM Serif Display',fontSize:'17px',color:'var(--green)'}}>
              {cardData.totalGanti} hari puasa ganti
            </div>
            <div style={{fontSize:'11px',color:'var(--green)',marginTop:'1px'}}>
              {cardData.tahun&&cardData.tahun!=='Semua'?'Ramadan '+cardData.tahun:'Semua tahun selesai'} ✓
            </div>
          </div>
        </div>

        {/* Canvas preview */}
        <div style={{
          width:'100%',aspectRatio:'1/1',borderRadius:'12px',overflow:'hidden',
          marginBottom:'12px', position:'relative',
          boxShadow:'0 6px 24px rgba(0,0,0,0.2)'
        }}>
          <canvas ref={canvasRef} style={{width:'100%',height:'100%',display:'block'}} />
          {!ready && (
            <div style={{position:'absolute',inset:0,background:'rgba(0,0,0,0.05)',display:'flex',alignItems:'center',justifyContent:'center'}}>
              <div className="spinner" />
            </div>
          )}
        </div>

        <div style={{fontSize:'11px',color:'var(--text-muted)',textAlign:'center',marginBottom:'12px'}}>
          {DESIGNS[designIdx].emoji} {DESIGNS[designIdx].name} · 1080 × 1080 px
        </div>

        {/* Prev / Next */}
        <div style={{display:'flex',gap:'8px',marginBottom:'10px'}}>
          <button onClick={prevDesign} style={{flex:1,padding:'10px',background:'var(--cream)',border:'none',borderRadius:'10px',cursor:'pointer',fontFamily:'DM Sans,sans-serif',fontSize:'13px',fontWeight:'600',color:'var(--text)'}}>
            ‹ Design Sebelum
          </button>
          <button onClick={nextDesign} style={{flex:1,padding:'10px',background:'var(--cream)',border:'none',borderRadius:'10px',cursor:'pointer',fontFamily:'DM Sans,sans-serif',fontSize:'13px',fontWeight:'600',color:'var(--text)'}}>
            Design Seterus ›
          </button>
        </div>

        {/* Download */}
        <button onClick={downloadCard} disabled={!ready||downloading} style={{
          width:'100%',padding:'14px',
          background:`linear-gradient(135deg,${accentColors[designIdx]},${accentColors[designIdx]}cc)`,
          color:'white',border:'none',borderRadius:'12px',
          fontSize:'15px',fontWeight:'600',cursor:ready?'pointer':'not-allowed',
          fontFamily:'DM Sans,sans-serif',opacity:ready?1:0.6,
          display:'flex',alignItems:'center',justifyContent:'center',gap:'8px'
        }}>
          {downloading?'⏳ Menyimpan...':ready?'⬇️ Download Kad (PNG)':'⏳ Menjana kad...'}
        </button>

        <div style={{fontSize:'11px',color:'var(--text-muted)',textAlign:'center',marginTop:'10px',lineHeight:'1.6'}}>
          💡 Download → share WhatsApp, Instagram, atau simpan dalam gallery
        </div>
      </div>
    </div>
  );
}


// ============================================================
// FAB MENU
// ============================================================
function FabMenu({ onClose, onAction }) {
  const items = [
    { icon:'🩸', label:'Log Period', sub:'Mark today as a period day', action:'period' },
    { icon:'🌙', label:'Fasting Makeup', sub:'Record a fasting makeup day', action:'puasa' },
    { icon:'💕', label:'Log Intimacy', sub:'Record an intimacy date', action:'intimacy' },
    { icon:'😣', label:'Log Symptoms', sub:'Record today symptoms', action:'symptom' },
  ];
  return (
    <>
      <div className="fab-menu-overlay" onClick={onClose} />
      <div className="fab-menu">
        <div style={{padding:'8px 16px 4px',fontSize:'11px',fontWeight:'700',color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'0.7px'}}>
          Log Today — {formatDateMY(todayStr())}
        </div>
        {items.map(item => (
          <button key={item.action} className="fab-menu-item" onClick={() => { onAction(item.action); onClose(); }}>
            <div className="fmi-icon" style={{background: item.action === 'period' ? 'var(--red-light)' : item.action === 'puasa' ? 'var(--green-light)' : item.action === 'intimacy' ? 'var(--rose-pale)' : 'var(--gold-light)'}}>
              {item.icon}
            </div>
            <div>
              <div className="fmi-label">{item.label}</div>
              <div className="fmi-sub">{item.sub}</div>
            </div>
          </button>
        ))}
      </div>
    </>
  );
}

// ============================================================
// MAIN APP
// ============================================================
function App() {
  const [authed, setAuthed] = useState(checkSession());
  const [pinExists, setPinExists] = useState(null);
  const [activeTab, setActiveTab] = useState('dashboard');
  const [showFab, setShowFab] = useState(false);
  const [dashData, setDashData] = useState(null);
  const [calMap, setCalMap] = useState({});
  const [symptoms, setSymptoms] = useState([]);
  const [toast, setToast] = useState('');
  const [quickLogDate, setQuickLogDate] = useState(null);
  const [loadingInit, setLoadingInit] = useState(true);
  const now = new Date();
  const [calMonth, setCalMonth] = useState({ year: now.getFullYear(), month: now.getMonth()+1 });

  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(''), 2200); };

  // Check PIN exists on load
  useEffect(() => {
    if (!authed) {
      gasCall('checkPinExists').then(r => {
        setPinExists(r && r.success ? r.exists : false);
        setLoadingInit(false);
      });
    } else {
      setLoadingInit(false);
    }
  }, [authed]);

  // Load dashboard data
  const loadDashboard = useCallback(async () => {
    const [dashRes, sympRes] = await Promise.all([
      gasCall('getDashboardData'),
      gasCall('getSymptoms')
    ]);
    if (dashRes && dashRes.success) setDashData(dashRes.data);
    if (sympRes && sympRes.success) setSymptoms(sympRes.data);
  }, []);

  const loadCalendar = useCallback(async (year, month) => {
    const res = await gasCall('getCalendarData', { year, month });
    if (res && res.success) {
      setCalMap(prev => ({ ...prev, ...res.data }));
    }
  }, []);

  useEffect(() => {
    if (authed) {
      loadDashboard();
      loadCalendar(calMonth.year, calMonth.month);
    }
  }, [authed]);

  useEffect(() => {
    if (authed) loadCalendar(calMonth.year, calMonth.month);
  }, [calMonth, authed]);

  const handleDataChange = async () => {
    await Promise.all([
      loadDashboard(),
      loadCalendar(calMonth.year, calMonth.month)
    ]);
  };

  const handleFabAction = (action) => {
    setQuickLogDate(todayStr());
  };

  if (loadingInit) {
    return (
      <div className="app" style={{alignItems:'center',justifyContent:'center'}}>
        <div className="login-logo" style={{marginBottom:'16px'}}>Cycle<span style={{color:'var(--plum)'}}>Track</span></div>
        <div className="spinner" />
      </div>
    );
  }

  if (!authed) {
    return (
      <div className="app">
        <LoginScreen
          isSetup={!pinExists}
          onLogin={() => { setAuthed(true); }}
        />
      </div>
    );
  }

  const navItems = [
    { id:'dashboard', icon:'🏠', label:'Home' },
    { id:'period', icon:'📅', label:'Cycle' },
    { id:'fab', icon:'', label:'' },
    { id:'puasa', icon:'🌙', label:'Fasting' },
    { id:'profile', icon:'👤', label:'Profile' },
  ];

  return (
    <div className="app">
      {/* CONTENT */}
      {activeTab === 'dashboard' && (
        <DashboardTab
          dashData={dashData}
          calMap={calMap}
          symptoms={symptoms}
          onDataChange={handleDataChange}
          currentMonth={calMonth}
          setCurrentMonth={setCalMonth}
        />
      )}
      {activeTab === 'period' && <PeriodTab onDataChange={handleDataChange} />}
      {activeTab === 'puasa' && <FastingTab onDataChange={handleDataChange} settings={dashData ? dashData.settings : null} />}
      {activeTab === 'profile' && (
        <ProfileTab
          settings={dashData ? dashData.settings : null}
          onDataChange={handleDataChange}
          onShowHelp={() => setActiveTab('help')}
        />
      )}
      {activeTab === 'help' && <HelpTab />}

      {/* FAB MENU */}
      {showFab && (
        <FabMenu
          onClose={() => setShowFab(false)}
          onAction={handleFabAction}
        />
      )}

      {/* QUICK LOG MODAL */}
      {quickLogDate && (
        <DateModal
          dateStr={quickLogDate}
          calMap={calMap}
          symptoms={symptoms}
          onClose={() => setQuickLogDate(null)}
          onSave={() => { handleDataChange(); setQuickLogDate(null); showToast('Saved ✓'); }}
          onRefresh={handleDataChange}
        />
      )}

      {/* BOTTOM NAV */}
      <nav className="bottom-nav">
        {navItems.map(item => {
          if (item.id === 'fab') {
            return (
              <button key="fab" className="nav-fab" onClick={() => setShowFab(f => !f)}>
                <span style={{fontSize:'24px',lineHeight:1}}>{showFab ? '✕' : '+'}</span>
              </button>
            );
          }
          return (
            <button
              key={item.id}
              className={`nav-item ${activeTab === item.id ? 'active' : ''}`}
              onClick={() => setActiveTab(item.id)}
            >
              <span className="nav-icon">{item.icon}</span>
              <span className="nav-label">{item.label}</span>
            </button>
          );
        })}
      </nav>

      {toast && <Toast msg={toast} onDone={() => setToast('')} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/ptracker/sw.js', { scope: '/ptracker/' })
        .then(r => console.log('[SW] Registered:', r.scope))
        .catch(e => console.warn('[SW] Error:', e));
    });
  }
</script>
</body>
</html>
