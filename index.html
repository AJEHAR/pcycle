// ============================================================
// PERIOD ACTIVE CARD
// ============================================================
function PeriodActiveCard({ activePeriod, onDataChange }) {
  const [showEndSheet, setShowEndSheet] = useState(false);
  const [endDate, setEndDate] = useState(todayStr());
  const [saving, setSaving] = useState(false);
  const [toast, setToast] = useState('');

  if (!activePeriod) return null;

  const { isActive, mightBeOngoing, lastLogDate, periodStart, duration, gapDays } = activePeriod;

  // Only show if period is active or might still be ongoing
  if (!isActive && !mightBeOngoing) return null;

  // Safety check - periodStart must be within 20 days
  const startDaysAgo = daysDiff(periodStart, todayStr());
  if (startDaysAgo > 20) return null;

  const handleEndToday = async () => {
    setSaving(true);
    await gasCall('markPeriodEnded', { endDate: todayStr() });
    setSaving(false);
    onDataChange && onDataChange();
    setToast('Period ended. Cycle updated ✓');
    setTimeout(() => setToast(''), 2200);
  };

  const handleEndOnDate = async () => {
    setSaving(true);
    await gasCall('markPeriodEnded', { endDate });
    setSaving(false);
    setShowEndSheet(false);
    onDataChange && onDataChange();
  };

  const periodStartFmt = formatDateShort(periodStart);
  const lastLogFmt = formatDateShort(lastLogDate);

  return (
    <>
      <div className="period-active-card">
        <div className="pac-icon">🩸</div>
        <div className="pac-info">
          {isActive ? (
            <>
              <div className="pac-title">Period ongoing — Day {duration}</div>
              <div className="pac-sub">Started {periodStartFmt} · Last logged {lastLogFmt}</div>
            </>
          ) : (
            <>
              <div className="pac-title">Period ended recently?</div>
              <div className="pac-sub">Last log was {gapDays} days ago ({lastLogFmt})</div>
            </>
          )}
        </div>
        <div className="pac-actions">
          {isActive && (
            <button className="pac-btn pac-btn-end" onClick={handleEndToday} disabled={saving}>
              {saving ? '...' : 'Ended Today'}
            </button>
          )}
          <button className="pac-btn pac-btn-log" onClick={() => setShowEndSheet(true)}>
            {isActive ? 'Pick Date' : 'Set End Date'}
          </button>
        </div>
      </div>

      {showEndSheet && (
        <div className="overlay" onClick={e => e.target.classList.contains('overlay') && setShowEndSheet(false)}>
          <div className="bottom-sheet">
            <div className="sheet-handle"/>
            <div className="sheet-header">
              <div className="sheet-title">🩸 When did your period end?</div>
              <div className="sheet-date">Started {periodStartFmt} · {duration} days logged</div>
            </div>
            <div className="sheet-body">
              <div className="input-group">
                <label className="input-label">Last day of period</label>
                <input className="input-field" type="date"
                  value={endDate}
                  min={periodStart}
                  max={todayStr()}
                  onChange={e => setEndDate(e.target.value)} />
              </div>
              <div style={{background:'var(--rose-pale)',borderRadius:'10px',padding:'10px 14px',marginBottom:'14px',fontSize:'12px',color:'var(--rose-dark)'}}>
                💡 If you stopped bleeding before today, pick that date. The system will complete the period log and update your cycle.
              </div>
              <div className="btn-row">
                <button className="btn btn-secondary" onClick={() => setShowEndSheet(false)}>Cancel</button>
                <button className="btn btn-primary" onClick={handleEndOnDate} disabled={saving}>
                  {saving ? '...' : 'Confirm End Date'}
                </button>
              </div>
            </div>
          </div>
        </div>
      )}

      {toast && <div className={`toast success`}>{toast}</div>}
    </>
  );
}

// ============================================================
// DASHBOARD TAB
// ============================================================
function DashboardTab({ dashData, calMap, symptoms, onDataChange, currentMonth, setCurrentMonth }) {
  const [selDate, setSelDate] = useState(null);
  const [showAnalysis, setShowAnalysis] = useState(false);
  const [activeSheet, setActiveSheet] = useState(null);

  if (!dashData) return (
    <div className="page-content">
      <div className="app-header">
        <div className="header-logo">Cycle<span>Track</span></div>
      </div>
      <div className="skeleton skeleton-hero" />
      <div style={{padding:'0 16px',display:'flex',gap:'12px',marginBottom:'16px'}}>
        {[1,2,3].map(i => <div key={i} className="skeleton" style={{flex:1,height:'100px',borderRadius:'var(--radius-sm)'}} />)}
      </div>
      <div style={{margin:'0 16px'}}>
        <div className="skeleton" style={{height:'260px',borderRadius:'var(--radius)'}} />
      </div>
    </div>
  );

  const { analysis, pregnancy, totalBakiPuasa, recentLogs, settings, activePeriod } = dashData;
  const phase = analysis && analysis.todayPhase ? analysis.todayPhase : { phase:'unknown', label:'No Data', color:'gray' };
  const name = settings && settings.user_name ? settings.user_name : 'Sayang';

  const phaseMessages = {
    period: `Take care of yourself. Get plenty of rest 💙`,
    fertile: `Fertile window active${analysis && analysis.nextOvulation ? ` — ovulation ${formatDateShort(analysis.nextOvulation)}` : ''}`,
    ovulation: `Ovulation day — your peak fertility ✨`,
    luteal: `Luteal phase${analysis && analysis.nextPeriod ? ` — period in ${daysDiff(todayStr(), analysis.nextPeriod)} days` : ''}`,
    safe: `Safe phase. Cycle running normally 🌿`,
    unknown: `Log your first period to start tracking`
  };

  const phaseIcons = { period:'🩸', fertile:'🌸', ovulation:'⭐', luteal:'🌙', safe:'🍃', unknown:'📅' };
  const phaseDay = phase.day > 0 ? `Day ${phase.day}` : '';

  // Countdown values
  let daysToperiod = '-', daysToOv = '-', periodDate = '', ovDate = '';
  if (analysis && analysis.nextPeriod) {
    const diff = daysDiff(todayStr(), analysis.nextPeriod);
    daysToperiod = diff > 0 ? diff : (diff === 0 ? 'Today' : 'Overdue');
    periodDate = formatDateShort(analysis.nextPeriod);
  }
  if (analysis && analysis.nextOvulation) {
    const diff = daysDiff(todayStr(), analysis.nextOvulation);
    daysToOv = diff > 0 ? diff : (diff === 0 ? 'Today' : 'Past');
    ovDate = formatDateShort(analysis.nextOvulation);
  }

  // Notifications
  const banners = [];
  if (analysis && analysis.nextPeriod) {
    const d = daysDiff(todayStr(), analysis.nextPeriod);
        if (d <= 3) {
      if (d < 0) banners.push({ type:'warning', msg:`🩸 Period was expected ${Math.abs(d)} day${Math.abs(d)!==1?'s':''} ago` });
      else if (d === 0) banners.push({ type:'info', msg:'🩸 Period expected today' });
      else banners.push({ type:'info', msg:`🩸 Period in ${d} day${d!==1?'s':''}` });
    }
  }
  if (analysis && !analysis.isStable && analysis.validCycles && analysis.validCycles.length >= 2) {
    banners.push({ type:'warning', msg:`⚠️ Your cycle is irregular (variance ${analysis.variance} days)` });
  }
  if (totalBakiPuasa > 0) {
    banners.push({ type:'warning', msg:`🌙 You still have ${totalBakiPuasa} days of fasting debt` });
  }

  if (pregnancy) {
    if (pregnancy.status === 'pregnant') {
      const trimNames = ['', 'First', 'Second', 'Third'];
      return (
        <div className="page-content">
          <div className="app-header">
            <div className="header-logo">Cycle<span>Track</span></div>
          </div>
          <div className="preg-hero">
            <div style={{position:'relative',zIndex:1}}>
              <div style={{color:'rgba(255,255,255,0.8)',fontSize:'13px',marginBottom:'4px'}}>Hello, {name} 🤰</div>
              <div className="preg-week">{pregnancy.weeks} Weeks {pregnancy.days} Days</div>
              <div className="preg-week-label">Trimester {trimNames[pregnancy.trimester]}</div>
              <div className="preg-progress">
                <div className="preg-progress-fill" style={{width:`${Math.min(100,(pregnancy.weeks/40)*100)}%`}} />
              </div>
              <div className="preg-edd">Expected Delivery Date: <strong style={{color:'white'}}>{formatDateMY(pregnancy.edd)}</strong></div>
              <div className="preg-countdown">{pregnancy.daysToEdd} days to go ⏳</div>
            </div>
          </div>
          {banners.map((b,i) => (
            <div key={i} className={`notif-banner ${b.type}`}>
              <div className="notif-text">{b.msg}</div>
            </div>
          ))}
          <div style={{padding:'0 16px 16px'}}>
            <div className="insight-card" style={{margin:'0 0 16px'}}>
              <div className="insight-label">💡 This Week{"'s"} Tip</div>
              <div className="insight-text">{getInsight('safe')}</div>
            </div>
          </div>
        </div>
      );
    }
    if (pregnancy.status === 'nifas') {
      return (
        <div className="page-content">
          <div className="app-header">
            <div className="header-logo">Cycle<span>Track</span></div>
          </div>
          <div className="phase-hero nifas">
            <div className="phase-greeting">Hello, {name}</div>
            <div className="phase-title">Postnatal Mode 🌙</div>
            <div className="phase-sub">Day {pregnancy.nifasDays} — {pregnancy.nifasRemaining} days remaining</div>
            <div className="phase-message">Rest and take care. Postnatal period ends {formatDateMY(pregnancy.nifasEnd)}.</div>
          </div>
        </div>
      );
    }
  }

  return (
    <div className="page-content">
      <div className="app-header">
        <div className="header-logo">Cycle<span>Track</span></div>
      </div>

      {banners.map((b,i) => (
        <div key={i} className={`notif-banner ${b.type}`} onClick={() => setActiveSheet('banner_' + i)}>
          <div className="notif-text">{b.msg}</div>
          <div style={{fontSize:'14px',opacity:0.6,marginLeft:'8px'}}>›</div>
        </div>
      ))}

      {/* PERIOD ACTIVE CARD */}
      {activePeriod && (
        <PeriodActiveCard
          activePeriod={activePeriod}
          onDataChange={onDataChange}
        />
      )}

      {/* PHASE HERO */}
      <div className={`phase-hero ${phase.phase}`} onClick={() => setActiveSheet('phase')}>
        <div className="phase-greeting">Hello, {name} {phaseIcons[phase.phase] || '🌸'}</div>
        <div className="phase-title">{phase.label} {phaseDay && `— ${phaseDay}`}</div>
        <div className="phase-sub">{analysis && analysis.dataInsufficient ? 'Insufficient data — need at least 1 full cycle' : `Average cycle: ${analysis ? analysis.avgCycle : 28} days`}</div>
        <div className="phase-message">{phaseMessages[phase.phase] || ''}</div>
        <div style={{position:'absolute',bottom:'12px',right:'16px',color:'rgba(255,255,255,0.5)',fontSize:'11px',zIndex:1}}>Tap for details ›</div>
      </div>

      {/* COUNTDOWN CARDS */}
      <div style={{marginBottom:'16px'}}>
        <div className="countdown-scroll">
          <div className="countdown-card" onClick={() => setActiveSheet('period')}>
            <div className="cc-icon">🩸</div>
            <div className="cc-label">Period</div>
            <div className="cc-value" style={{fontSize: typeof daysToperiod === 'string' ? '18px' : '26px'}}>
              {daysToperiod}
            </div>
            <div className="cc-sub">
              {daysToperiod === 'Today' ? periodDate :
               daysToperiod === 'Overdue' ? `expected ${periodDate}` :
               typeof daysToperiod === 'number' ? `days — ${periodDate}` : '-'}
            </div>
          </div>
          <div className="countdown-card" onClick={() => setActiveSheet('ovulation')}>
            <div className="cc-icon">⭐</div>
            <div className="cc-label">Ovulation</div>
            <div className="cc-value" style={{fontSize: typeof daysToOv === 'string' ? '18px' : '26px'}}>
              {typeof daysToOv === 'number' ? daysToOv : daysToOv}
            </div>
            <div className="cc-sub">
              {typeof daysToOv === 'number' && daysToOv > 0 ? `days — ${ovDate}` : ovDate}
            </div>
          </div>
          <div className="countdown-card" onClick={() => setActiveSheet('fasting')}>
            <div className="cc-icon">🌙</div>
            <div className="cc-label">Fasting Debt</div>
            <div className="cc-value">{totalBakiPuasa}</div>
            <div className="cc-sub">days remaining</div>
          </div>
          {analysis && analysis.fertileStart && (
            <div className="countdown-card" onClick={() => setActiveSheet('fertile')}>
              <div className="cc-icon">🌸</div>
              <div className="cc-label">Fertile Window</div>
              <div className="cc-value">{formatDateShort(analysis.fertileStart)}</div>
              <div className="cc-sub">to {formatDateShort(analysis.fertileEnd)}</div>
            </div>
          )}
        </div>
      </div>

      {/* CALENDAR */}
      <CalendarView
        calMap={calMap}
        analysis={analysis}
        onDateTap={(ds) => setSelDate(ds)}
        currentMonth={currentMonth}
        setCurrentMonth={setCurrentMonth}
        activePeriod={activePeriod}
      />

      {/* INSIGHT */}
      <div className="insight-card" onClick={() => setActiveSheet('insight')}>
        <div className="insight-label">💡 Today{"'s"} Insight</div>
        <div className="insight-text">{getInsight(phase.phase)}</div>
        <div style={{fontSize:'11px',color:'var(--rose-dark)',marginTop:'8px',fontWeight:'600'}}>Tap to read more →</div>
      </div>

      {/* ANALYSIS */}
      {analysis && (
        <div className="analysis-wrap">
          <div className="collapsible-header" onClick={() => setShowAnalysis(a => !a)}>
            <div className="section-title">📊 Cycle Analysis</div>
            <div className={`collapsible-arrow ${showAnalysis ? 'open' : ''}`}>▾</div>
          </div>
          {showAnalysis && (
            <div>
              <div className="stat-grid">
                <div className="stat-card" onClick={() => setActiveSheet('avgcycle')}>
                  <div className="stat-val">{analysis.avgCycle}<span className="stat-unit"> days</span></div>
                  <div className="stat-label">Average Cycle</div>
                  <div style={{fontSize:'10px',color:'var(--text-muted)',marginTop:'4px'}}>Tap for details</div>
                </div>
                <div className="stat-card" onClick={() => setActiveSheet('stability')}>
                  <div style={{marginBottom:'6px'}}>
                    <span className={`badge ${analysis.isStable ? 'badge-green' : 'badge-orange'}`}>
                      {analysis.isStable ? '✓ Stable' : '⚠ Irregular'}
                    </span>
                  </div>
                  <div className="stat-label">Variance: {analysis.variance} days</div>
                  <div style={{fontSize:'10px',color:'var(--text-muted)',marginTop:'4px'}}>Tap for details</div>
                </div>
                <div className="stat-card">
                  <div className="stat-val">{analysis.totalLogs}<span className="stat-unit"> records</span></div>
                  <div className="stat-label">Period Records</div>
                </div>
                <div className="stat-card">
                  <div className="stat-val">{analysis.validCycles ? analysis.validCycles.length : 0}<span className="stat-unit"> cycles</span></div>
                  <div className="stat-label">Valid Cycles</div>
                </div>
              </div>
              {analysis.dataInsufficient && (
                <div style={{background:'var(--orange-light)',borderRadius:'12px',padding:'10px 14px',marginTop:'10px',fontSize:'12px',color:'var(--orange)'}}>
                  ⚠️ Insufficient data. Log sekurang-kurangnya 2 period untuk jangkaan yang tepat.
                </div>
              )}
            </div>
          )}
        </div>
      )}

      {/* RECENT LOGS */}
      <div style={{margin:'16px 16px 0'}}>
        <div className="section-title">📋 Recent Activity</div>
        <div className="card">
          {recentLogs && recentLogs.length > 0 ? recentLogs.map((log,i) => (
            <div key={i} className="log-item" onClick={() => setSelDate && setSelDate(log.date)}>
              <div className={`log-icon ${log.type}`}>
                {log.type === 'period' ? '🩸' : log.type === 'intimacy' ? '💕' : '🌙'}
              </div>
              <div style={{flex:1}}>
                <div className="log-label">{log.label}</div>
                <div className="log-date">{formatDateMY(log.date)}</div>
              </div>
              <div style={{color:'var(--text-muted)',fontSize:'14px'}}>›</div>
            </div>
          )) : (
            <div className="empty-state" style={{padding:'20px'}}>
              <div className="empty-icon">📋</div>
              <div className="empty-title">No activity yet</div>
              <div className="empty-sub">Tap + to start logging</div>
            </div>
          )}
        </div>
      </div>

      {selDate && (
        <DateModal
          dateStr={selDate}
          calMap={calMap}
          symptoms={symptoms}
          onClose={() => setSelDate(null)}
          onSave={onDataChange}
          onRefresh={onDataChange}
        />
      )}

      {activeSheet === 'phase' && analysis && (
        <InfoSheet title={`${phase.label} Phase`} icon={phaseIcons[phase.phase] || '🌸'} onClose={() => setActiveSheet(null)}>
          <div className="info-highlight">
            <div className="info-highlight-title">Current Phase</div>
            <div className="info-highlight-value">{phase.label}</div>
            <div className="info-highlight-sub">{phaseDay || 'Tracking active'}</div>
          </div>
          {analysis.lmp && <div>
            <div className="info-row"><span className="info-row-label">Last period started</span><span className="info-row-value">{formatDateMY(analysis.lmp)}</span></div>
            {analysis.nextPeriod && <div className="info-row"><span className="info-row-label">Next period expected</span><span className="info-row-value">{formatDateMY(analysis.nextPeriod)}</span></div>}
            {analysis.nextOvulation && <div className="info-row"><span className="info-row-label">Ovulation estimated</span><span className="info-row-value">{formatDateMY(analysis.nextOvulation)}</span></div>}
            {analysis.fertileStart && <div className="info-row"><span className="info-row-label">Fertile window</span><span className="info-row-value">{formatDateShort(analysis.fertileStart)} – {formatDateShort(analysis.fertileEnd)}</span></div>}
            <div className="info-row"><span className="info-row-label">Average cycle</span><span className="info-row-value">{analysis.avgCycle} days</span></div>
          </div>}
          <div className="tip-box">{phaseMessages[phase.phase]}</div>
        </InfoSheet>
      )}

      {activeSheet === 'period' && analysis && (
        <InfoSheet title="Next Period" icon="🩸" onClose={() => setActiveSheet(null)}>
          <div className="info-highlight">
            <div className="info-highlight-title">Expected Date</div>
            <div className="info-highlight-value" style={{fontSize:'22px'}}>{analysis.nextPeriod ? formatDateMY(analysis.nextPeriod) : 'Not enough data'}</div>
            <div className="info-highlight-sub">{typeof daysToperiod === 'number' ? `${daysToperiod} days from now` : daysToperiod === 'Today' ? 'Expected today' : daysToperiod === 'Overdue' ? 'Past expected date' : ''}</div>
          </div>
          {analysis.lmp && <div className="info-row"><span className="info-row-label">Last period (LMP)</span><span className="info-row-value">{formatDateMY(analysis.lmp)}</span></div>}
          <div className="info-row"><span className="info-row-label">Based on average</span><span className="info-row-value">{analysis.avgCycle} days</span></div>
          <div className="info-row"><span className="info-row-label">Periods logged</span><span className="info-row-value">{analysis.totalLogs}</span></div>
          <div className="tip-box">Predictions improve with more data. After 3 full cycles, accuracy increases significantly.</div>
        </InfoSheet>
      )}

      {activeSheet === 'ovulation' && analysis && (
        <InfoSheet title="Ovulation" icon="⭐" onClose={() => setActiveSheet(null)}>
          <div className="info-highlight">
            <div className="info-highlight-title">Estimated Ovulation</div>
            <div className="info-highlight-value" style={{fontSize:'22px'}}>{analysis.nextOvulation ? formatDateMY(analysis.nextOvulation) : 'Not enough data'}</div>
            <div className="info-highlight-sub">{typeof daysToOv === 'number' && daysToOv > 0 ? `${daysToOv} days from now` : daysToOv === 'Today' ? 'Estimated today' : 'Past estimated date'}</div>
          </div>
          {analysis.fertileStart && <>
            <div className="info-row"><span className="info-row-label">Fertile window opens</span><span className="info-row-value">{formatDateMY(analysis.fertileStart)}</span></div>
            <div className="info-row"><span className="info-row-label">Fertile window closes</span><span className="info-row-value">{formatDateMY(analysis.fertileEnd)}</span></div>
          </>}
          <div className="info-row"><span className="info-row-label">Luteal phase</span><span className="info-row-value">14 days (fixed)</span></div>
          <div className="info-row"><span className="info-row-label">Calculation</span><span className="info-row-value">Next period – 14 days</span></div>
          <div className="tip-box">Sperm can survive up to 5 days — which is why the fertile window starts 5 days before ovulation day itself.</div>
        </InfoSheet>
      )}

      {activeSheet === 'fertile' && analysis && (
        <InfoSheet title="Fertile Window" icon="🌸" onClose={() => setActiveSheet(null)}>
          <div className="info-highlight" style={{background:'var(--orange-light)'}}>
            <div className="info-highlight-title" style={{color:'var(--orange)'}}>Window Dates</div>
            <div className="info-highlight-value">{analysis.fertileStart ? `${formatDateShort(analysis.fertileStart)} – ${formatDateShort(analysis.fertileEnd)}` : 'Not calculated'}</div>
            <div className="info-highlight-sub">{analysis.isStable ? '6-day window (stable)' : '8-day window (irregular)'}</div>
          </div>
          <div className="info-row"><span className="info-row-label">Peak fertility</span><span className="info-row-value">{analysis.nextOvulation ? formatDateShort(analysis.nextOvulation) : '—'}</span></div>
          <div className="info-row"><span className="info-row-label">Cycle stability</span><span className="info-row-value">{analysis.isStable ? '✓ Stable' : '⚠ Irregular'}</span></div>
          <div className="info-row"><span className="info-row-label">Variance</span><span className="info-row-value">{analysis.variance} days</span></div>
          <div className="tip-box">{analysis.isStable ? 'Stable cycle — fertile window predictions are reliable.' : 'Irregular cycle — fertile window widened to account for uncertainty.'}</div>
        </InfoSheet>
      )}

      {activeSheet === 'fasting' && (
        <InfoSheet title="Fasting Debt" icon="🌙" onClose={() => setActiveSheet(null)}>
          <div className="info-highlight" style={{background:'var(--green-light)'}}>
            <div className="info-highlight-title" style={{color:'var(--green)'}}>Total Remaining</div>
            <div className="info-highlight-value">{totalBakiPuasa}</div>
            <div className="info-highlight-sub">days left to make up</div>
          </div>
          {totalBakiPuasa === 0 ? <div style={{textAlign:'center',padding:'16px',fontSize:'15px',color:'var(--green)'}}>Alhamdulillah — all fasting debts settled ✅</div> : <div className="tip-box">Go to the Fasting tab to see a breakdown by year and record makeup days.</div>}
        </InfoSheet>
      )}

      {activeSheet === 'insight' && (
        <InfoSheet title="Daily Insight" icon="💡" onClose={() => setActiveSheet(null)}>
          <div style={{background:'var(--rose-pale)',borderRadius:'12px',padding:'16px',marginBottom:'16px'}}>
            <div style={{fontSize:'14px',color:'var(--text)',lineHeight:'1.7'}}>{getInsight(phase.phase)}</div>
          </div>
          <div style={{fontSize:'12px',fontWeight:'700',color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'0.7px',marginBottom:'10px'}}>About the {phase.label} phase</div>
          {phase.phase === 'period' && <div style={{fontSize:'13px',color:'var(--text-light)',lineHeight:'1.7'}}>Estrogen and progesterone are at their lowest during menstruation. Iron-rich foods like lentils, spinach, and red meat can help replenish what is lost through bleeding. Rest is especially beneficial in the first 1–2 days.</div>}
          {phase.phase === 'fertile' && <div style={{fontSize:'13px',color:'var(--text-light)',lineHeight:'1.7'}}>Estrogen peaks during the fertile phase, often bringing higher energy and improved mood. Cervical mucus becomes clear and stretchy — a natural sign the fertile window is open.</div>}
          {phase.phase === 'ovulation' && <div style={{fontSize:'13px',color:'var(--text-light)',lineHeight:'1.7'}}>Ovulation is triggered by a surge in LH (luteinising hormone). Some women notice a mild twinge on one side called mittelschmerz as the follicle releases the egg.</div>}
          {phase.phase === 'luteal' && <div style={{fontSize:'13px',color:'var(--text-light)',lineHeight:'1.7'}}>Progesterone rises after ovulation. If no fertilisation occurs, it drops sharply — triggering PMS and eventually your next period. Magnesium and reducing caffeine can ease discomfort.</div>}
          {phase.phase === 'safe' && <div style={{fontSize:'13px',color:'var(--text-light)',lineHeight:'1.7'}}>The early follicular phase is a natural reset. Estrogen rises gradually and energy tends to return. A good time for exercise, new routines, and being social.</div>}
          {phase.phase === 'unknown' && <div style={{fontSize:'13px',color:'var(--text-light)',lineHeight:'1.7'}}>Log at least one full cycle to unlock phase-specific insights. Tap any calendar date to start recording.</div>}
        </InfoSheet>
      )}

      {activeSheet === 'avgcycle' && analysis && (
        <InfoSheet title="Average Cycle" icon="📊" onClose={() => setActiveSheet(null)}>
          <div className="info-highlight">
            <div className="info-highlight-title">Your Average</div>
            <div className="info-highlight-value">{analysis.avgCycle}<span style={{fontSize:'16px',fontFamily:'DM Sans'}}> days</span></div>
            <div className="info-highlight-sub">Moving average of last {Math.min(3, analysis.validCycles ? analysis.validCycles.length : 0)} cycles</div>
          </div>
          {analysis.validCycles && analysis.validCycles.length > 0 && (
            <div style={{marginBottom:'14px'}}>
              <div style={{fontSize:'11px',fontWeight:'700',color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'0.7px',marginBottom:'8px'}}>Cycle History</div>
              {[...analysis.validCycles].reverse().map((c, i) => (
                <div key={i} className="info-row">
                  <span className="info-row-label">Cycle {analysis.validCycles.length - i}</span>
                  <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
                    <div style={{width:`${Math.round((c/45)*70)}px`,height:'6px',borderRadius:'3px',background:'var(--rose-light)',minWidth:'4px'}} />
                    <span className="info-row-value">{c} days</span>
                  </div>
                </div>
              ))}
            </div>
          )}
          <div className="info-row"><span className="info-row-label">Periods logged</span><span className="info-row-value">{analysis.totalLogs}</span></div>
          <div className="tip-box">Only the 3 most recent valid cycles are used in the average. Older data or outliers do not affect this number.</div>
        </InfoSheet>
      )}

      {activeSheet === 'stability' && analysis && (
        <InfoSheet title="Cycle Stability" icon="📈" onClose={() => setActiveSheet(null)}>
          <div className="info-highlight" style={{background: analysis.isStable ? 'var(--green-light)' : 'var(--orange-light)'}}>
            <div className="info-highlight-title" style={{color: analysis.isStable ? 'var(--green)' : 'var(--orange)'}}>Status</div>
            <div className="info-highlight-value">{analysis.isStable ? 'Stable ✓' : 'Irregular ⚠'}</div>
            <div className="info-highlight-sub">Variance: {analysis.variance} days</div>
          </div>
          <div className="info-row"><span className="info-row-label">Stable if variance is</span><span className="info-row-value">8 days or less</span></div>
          <div className="info-row"><span className="info-row-label">Your variance</span><span className="info-row-value" style={{color: analysis.isStable ? 'var(--green)' : 'var(--orange)'}}>{analysis.variance} days</span></div>
          <div className="info-row"><span className="info-row-label">Valid cycles</span><span className="info-row-value">{analysis.validCycles ? analysis.validCycles.length : 0}</span></div>
          <div className="tip-box">{analysis.isStable ? 'Your cycle is regular — period and ovulation predictions are more accurate.' : 'Irregular cycles can result from stress, weight changes, illness, or hormonal shifts. Your fertile window has been widened accordingly.'}</div>
        </InfoSheet>
      )}

    </div>
  );
}


// ============================================================
// PERIOD DETAIL SHEET
// ============================================================
function PeriodDetailSheet({ log, allDayLogs, onClose, onDelete, onDataChange }) {
  const [confirmDelete, setConfirmDelete] = useState(false);
  const [deleting, setDeleting] = useState(false);

  const start = log.start_date;
  const end = log.end_date;
  const duration = parseInt(log.duration) || 0;
  const cycleLen = log.cycle_length ? parseInt(log.cycle_length) : null;
  const isOutlier = log.is_outlier === 'true';

  // Get daily logs for this period
  const dailyLogs = allDayLogs.filter(d => {
    if (!d.date || !start) return false;
    const dt = d.date;
    return dt >= start && dt <= (end || start);
  }).sort((a,b) => a.date > b.date ? 1 : -1);

  const flowColors = {
    Spotting:'var(--rose-light)', Light:'var(--orange-light)',
    Moderate:'var(--red-light)', Heavy:'#ffb3b3',
    Ringan:'var(--orange-light)', Sederhana:'var(--red-light)', Lebat:'#ffb3b3'
  };
  const flowDots = { Spotting:1, Light:2, Moderate:3, Heavy:4, Ringan:2, Sederhana:3, Lebat:4 };

  const handleDelete = async () => {
    setDeleting(true);
    // Delete all days in this period
    const daysToDelete = [];
    if (start && end) {
      let cur = new Date(start + 'T00:00:00');
      const endD = new Date(end + 'T00:00:00');
      while (cur <= endD) {
        daysToDelete.push(`${cur.getFullYear()}-${String(cur.getMonth()+1).padStart(2,'0')}-${String(cur.getDate()).padStart(2,'0')}`);
        cur.setDate(cur.getDate() + 1);
      }
    }
    for (const d of daysToDelete) {
      await gasCall('deletePeriodDay', { date: d });
    }
    setDeleting(false);
    onDelete && onDelete();
    onClose();
  };

  return (
    <div className="overlay" onClick={e => e.target.classList.contains('overlay') && onClose()}>
      <div className="bottom-sheet">
        <div className="sheet-handle"/>
        <div className="sheet-header">
          <div className="sheet-title">🩸 {formatDateShort(start)} — {formatDateShort(end)}</div>
          <div className="sheet-date">
            {duration} days of bleeding
            {cycleLen && ` · ${cycleLen} day cycle`}
            {isOutlier && ' · ⚠️ Outlier'}
          </div>
        </div>

        <div style={{padding:'0 20px 20px'}}>
          {/* CYCLE INFO */}
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px',margin:'16px 0'}}>
            <div style={{background:'var(--rose-pale)',borderRadius:'12px',padding:'12px 14px'}}>
              <div style={{fontSize:'11px',color:'var(--rose-dark)',fontWeight:'600',marginBottom:'4px'}}>DURATION</div>
              <div style={{fontFamily:'DM Serif Display',fontSize:'24px',color:'var(--text)'}}>{duration}</div>
              <div style={{fontSize:'11px',color:'var(--text-muted)'}}>days of bleeding</div>
            </div>
            <div style={{background: cycleLen ? (isOutlier ? 'var(--orange-light)' : 'var(--green-light)') : 'var(--cream-dark)', borderRadius:'12px',padding:'12px 14px'}}>
              <div style={{fontSize:'11px',color: isOutlier ? 'var(--orange)' : 'var(--green)',fontWeight:'600',marginBottom:'4px'}}>CYCLE LENGTH</div>
              <div style={{fontFamily:'DM Serif Display',fontSize:'24px',color:'var(--text)'}}>{cycleLen || '—'}</div>
              <div style={{fontSize:'11px',color:'var(--text-muted)'}}>
                {cycleLen ? (isOutlier ? '⚠️ Outlier — excluded' : '✓ Used in average') : 'First period'}
              </div>
            </div>
          </div>

          {/* OUTLIER EXPLANATION */}
          {isOutlier && cycleLen && (
            <div style={{background:'var(--orange-light)',borderRadius:'10px',padding:'10px 14px',marginBottom:'14px',fontSize:'12px',color:'var(--orange)'}}>
              ⚠️ This cycle ({cycleLen} days) is outside your min/max range and was excluded from the average calculation. Go to Profile → Cycle Settings to adjust your range.
            </div>
          )}

          {/* DAILY BREAKDOWN */}
          {dailyLogs.length > 0 && (
            <div style={{marginBottom:'16px'}}>
              <div style={{fontSize:'11px',fontWeight:'700',color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'0.7px',marginBottom:'10px'}}>
                Daily Breakdown
              </div>
              {dailyLogs.map((d,i) => {
                const flow = d.flow || '';
                const symps = d.symptoms ? d.symptoms.split(',').filter(Boolean) : [];
                const dotCount = flowDots[flow] || 0;
                return (
                  <div key={i} style={{display:'flex',alignItems:'center',gap:'10px',padding:'8px 0',borderBottom:'1px solid var(--cream-dark)'}}>
                    <div style={{width:'60px',fontSize:'12px',color:'var(--text-light)',flexShrink:0}}>
                      {formatDateShort(d.date)}
                    </div>
                    <div style={{display:'flex',gap:'3px',alignItems:'center',width:'70px'}}>
                      {flow ? Array.from({length:4}).map((_,fi) => (
                        <div key={fi} style={{width:'8px',height:'8px',borderRadius:'50%',
                          background: fi < dotCount ? (flowColors[flow] || 'var(--rose-light)') : 'var(--cream-dark)'}} />
                      )) : <span style={{fontSize:'11px',color:'var(--text-muted)'}}>—</span>}
                    </div>
                    <div style={{fontSize:'12px',color:'var(--text-light)',flex:1}}>
                      {flow || ''}
                    </div>
                    <div style={{fontSize:'11px',color:'var(--text-muted)',flex:2,textAlign:'right'}}>
                      {symps.length > 0 ? symps.slice(0,2).join(', ') + (symps.length > 2 ? '...' : '') : ''}
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {dailyLogs.length === 0 && (
            <div style={{textAlign:'center',padding:'16px',color:'var(--text-muted)',fontSize:'13px',marginBottom:'14px'}}>
              No daily details logged for this period.
            </div>
          )}

          {/* ACTIONS */}
          {!confirmDelete ? (
            <div className="btn-row">
              <button className="btn btn-secondary" onClick={onClose}>Close</button>
              <button className="btn btn-danger" onClick={() => setConfirmDelete(true)}>Delete Period</button>
            </div>
          ) : (
            <div>
              <div style={{background:'var(--red-light)',borderRadius:'10px',padding:'10px 14px',marginBottom:'12px',fontSize:'12px',color:'var(--red)',textAlign:'center'}}>
                Delete this entire period record? This cannot be undone.
              </div>
              <div className="btn-row">
                <button className="btn btn-secondary" onClick={() => setConfirmDelete(false)}>Cancel</button>
                <button className="btn btn-danger" onClick={handleDelete} disabled={deleting}>
                  {deleting ? 'Deleting...' : 'Yes, Delete'}
                </button>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function PeriodTab({ onDataChange }) {
  const [logs, setLogs] = useState(null);
  const [dayLogs, setDayLogs] = useState([]);
  const [analysis, setAnalysis] = useState(null);
  const [loading, setLoading] = useState(true);
  const [selectedLog, setSelectedLog] = useState(null);

  const loadData = async () => {
    setLoading(true);
    const [logsRes, anRes, dayRes] = await Promise.all([
      gasCall('getPeriodLogs'),
      gasCall('getCycleAnalysis'),
      gasCall('getPeriodDayLogs')
    ]);
    if (logsRes && logsRes.success) setLogs(logsRes.data);
    if (anRes && anRes.success) setAnalysis(anRes.data);
    if (dayRes && dayRes.success) setDayLogs(dayRes.data);
    setLoading(false);
  };

  useEffect(() => { loadData(); }, []);

  if (loading) return (
    <div className="page-content">
      <div className="app-header">
        <div className="header-logo">📅 <span style={{fontSize:'16px',fontFamily:'DM Sans'}}>Cycle Records</span></div>
      </div>
      <div style={{padding:'0 16px'}}>
        {[1,2,3].map(i => <div key={i} className="skeleton skeleton-card" />)}
      </div>
    </div>
  );

  return (
    <div className="page-content">
      <div className="app-header">
        <div className="header-logo">📅 <span style={{fontSize:'16px',fontFamily:'DM Sans'}}>Cycle Records</span></div>
      </div>

      {analysis && (
        <div style={{margin:'0 16px 16px'}}>
          <div className="stat-grid">
            <div className="stat-card">
              <div className="stat-val">{analysis.avgCycle}<span className="stat-unit"> days</span></div>
              <div className="stat-label">Average Cycle</div>
            </div>
            <div className="stat-card">
              <div style={{marginBottom:'4px'}}>
                <span className={`badge ${analysis.isStable ? 'badge-green' : 'badge-orange'}`}>
                  {analysis.isStable ? '✓ Stable' : '⚠ Irregular'}
                </span>
              </div>
              <div className="stat-label">Variance: {analysis.variance} days</div>
            </div>
          </div>
          {analysis.nextPeriod && (
            <div style={{background:'var(--rose-pale)',borderRadius:'12px',padding:'12px 14px',marginTop:'10px',display:'flex',alignItems:'center',gap:'10px'}}>
              <span style={{fontSize:'20px'}}>🩸</span>
              <div>
                <div style={{fontSize:'12px',color:'var(--rose-dark)',fontWeight:'600'}}>Next Expected Period</div>
                <div style={{fontSize:'15px',color:'var(--text)',fontWeight:'500'}}>{formatDateMY(analysis.nextPeriod)}</div>
              </div>
            </div>
          )}
        </div>
      )}

      <div style={{padding:'0 16px'}}>
        <div className="section-title">All Period Records</div>
        {logs && logs.length > 0 ? logs.map(log => (
          <div key={log.id} className="period-list-item" onClick={() => setSelectedLog(log)}>
            <div className="pli-dot" style={{background: log.is_outlier === 'true' ? 'var(--text-muted)' : 'var(--rose)'}} />
            <div className="pli-info">
              <div className="pli-dates">{formatDateMY(log.start_date)} — {log.end_date ? formatDateMY(log.end_date) : 'Active'}</div>
              <div className="pli-meta">
                {log.duration ? `${log.duration} days of bleeding` : ''}
                {log.is_outlier === 'true' ? ' · ⚠️ Outlier' : ''}
              </div>
            </div>
            <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
              {log.cycle_length && (
                <div style={{textAlign:'right'}}>
                  <div className="pli-cycle">{log.cycle_length}</div>
                  <div className="pli-cycle-label">day cycle</div>
                </div>
              )}
              <div style={{color:'var(--text-muted)',fontSize:'16px'}}>›</div>
            </div>
          </div>
        )) : (
          <div className="empty-state">
            <div className="empty-icon">📅</div>
            <div className="empty-title">No period records</div>
            <div className="empty-sub">Tap + or tap a date on the calendar to log your first period</div>
          </div>
        )}
      </div>

      {selectedLog && (
        <PeriodDetailSheet
          log={selectedLog}
          allDayLogs={dayLogs}
          onClose={() => setSelectedLog(null)}
          onDelete={() => { loadData(); onDataChange && onDataChange(); }}
          onDataChange={onDataChange}
        />
      )}
    </div>
  );
}

function FastingTab({ onDataChange, settings }) {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [showAddHutang, setShowAddHutang] = useState(false);
  const [showAddGanti, setShowAddGanti] = useState(false);
  const [hutangForm, setHutangForm] = useState({ tahun: new Date().getFullYear().toString(), punca: 'haid', jumlah_days: '', catatan: '' });
  const [gantiForm, setGantiForm] = useState({ hutang_id: '', tarikh_ganti: todayStr(), catatan: '' });
  const [saving, setSaving] = useState(false);
  const [expandedTahun, setExpandedTahun] = useState({});
  const [showCongratCard, setShowCongratCard] = useState(false);
  const [congratCardData, setCongratCardData] = useState(null);

  const loadData = async () => {
    setLoading(true);
    const res = await gasCall('getPuasaData');
    if (res && res.success) {
      setData(res.data);
      // Auto expand years with remaining debt
      const exp = {};
      Object.keys(res.data.byTahun).forEach(t => {
        if (res.data.byTahun[t].baki > 0) exp[t] = true;
      });
      setExpandedTahun(exp);
    }
    setLoading(false);
  };

  useEffect(() => { loadData(); }, []);

  const saveHutang = async () => {
    if (!hutangForm.jumlah_days || parseInt(hutangForm.jumlah_days) <= 0) return;
    setSaving(true);
    await gasCall('addHutangPuasa', hutangForm);
    setSaving(false);
    setShowAddHutang(false);
    setHutangForm({ tahun: new Date().getFullYear().toString(), punca: 'haid', jumlah_days: '', catatan: '' });
    loadData(); onDataChange && onDataChange();
  };

  const saveGanti = async () => {
    if (!gantiForm.hutang_id || !gantiForm.tarikh_ganti) return;
    setSaving(true);
    await gasCall('addGantiPuasa', gantiForm);
    setSaving(false);
    setShowAddGanti(false);
    loadData(); onDataChange && onDataChange();
  };

  const allHutangWithBaki = data ? (data.allHutang || []).filter(h => parseInt(h.baki) > 0) : [];
  const years = data ? Object.keys(data.byTahun).sort((a,b) => b-a) : [];
  const totalBaki = data ? years.reduce((s,t) => s + parseInt(data.byTahun[t].baki || 0), 0) : 0;

  if (loading) return (
    <div className="page-content">
      <div className="app-header">
        <div className="header-logo">🌙 <span style={{fontSize:'16px',fontFamily:'DM Sans'}}>Fasting Makeup</span></div>
      </div>
      <div style={{padding:'0 16px'}}>
        {[1,2,3].map(i => <div key={i} className="skeleton skeleton-card" />)}
      </div>
    </div>
  );

  return (
    <div className="page-content">
      <div className="app-header">
        <div className="header-logo">🌙 <span style={{fontSize:'16px',fontFamily:'DM Sans'}}>Fasting Makeup</span></div>
      </div>

      {/* SUMMARY */}
      <div style={{margin:'0 16px 16px'}}>
        {totalBaki === 0 && data && years.length > 0 ? (
          <div style={{background:'var(--green-light)',borderRadius:'var(--radius-sm)',padding:'16px',textAlign:'center'}}>
            <div style={{fontSize:'28px',marginBottom:'6px'}}>✅</div>
            <div style={{fontFamily:'DM Serif Display',fontSize:'18px',color:'var(--green)'}}>Alhamdulillah!</div>
            <div style={{fontSize:'13px',color:'var(--green)',marginTop:'4px'}}>All fasting debts have been settled</div>
            <button
              onClick={() => {
                const totalG = years.reduce((s,t) => s + parseInt(data.byTahun[t].ganti || 0), 0);
                setCongratCardData({ tahun: 'Semua', totalGanti: totalG });
                setShowCongratCard(true);
              }}
              style={{marginTop:'12px',padding:'10px 20px',background:'linear-gradient(135deg,#1a3d2b,#2d6b47)',color:'white',border:'none',borderRadius:'10px',fontSize:'13px',fontWeight:'600',cursor:'pointer',fontFamily:'DM Sans,sans-serif',display:'inline-flex',alignItems:'center',gap:'6px'}}
            >
              🎉 Jana Kad Tahniah
            </button>
          </div>
        ) : totalBaki > 0 ? (
          <div style={{background:'var(--orange-light)',borderRadius:'var(--radius-sm)',padding:'14px 16px',display:'flex',alignItems:'center',gap:'12px'}}>
            <div style={{fontSize:'28px'}}>🌙</div>
            <div>
              <div style={{fontFamily:'DM Serif Display',fontSize:'22px',color:'var(--orange)'}}>{totalBaki} days</div>
              <div style={{fontSize:'12px',color:'var(--text-light)'}}>Total remaining fasting debt (all years)</div>
            </div>
          </div>
        ) : null}
      </div>

      {/* ACTION BUTTONS */}
      <div style={{padding:'0 16px',marginBottom:'16px'}}>
        <div className="btn-row">
          <button className="btn btn-outline" onClick={() => setShowAddHutang(true)}>+ Add Hutang</button>

              <div className="input-group">
                <label className="input-label">Notes (Optional)</label>

              </div>
              <div className="btn-row">
                <button className="btn btn-secondary" onClick={() => setShowAddHutang(false)}>Cancel</button>

              </div>
            </div>
          </div>
        </div>
      )}

      {/* ADD GANTI MODAL */}

function PurityGuideSheet({ dashData, onClose }) {

  const periodDay = phase && phase.day || 0;
  const lmp = analysis && analysis.lmp;

  const MAX_HAID = 15;
  const MIN_SUCI = 15;

  let status = 'suci';
  let statusMsg = '';
  let detail = '';
  let alert = null;

  if (isPeriod) {
    if (periodDay <= MAX_HAID) {
      status = 'haid';
      statusMsg = 'Currently in Haid (Day ' + periodDay + ')';
      detail = 'Prayer and fasting are suspended. Quran recitation from memory (without touching the Mushaf) is permitted according to many scholars.';
      if (periodDay >= 13) {
        alert = 'Day ' + periodDay + ' of ' + MAX_HAID + ' maximum (Shafii). If bleeding continues past Day 15, it becomes Istihadah — please proceed with ghusl and resume prayers.';
      }

      status = 'istihadah';
      statusMsg = 'Istihadah (Day ' + periodDay + ' — exceeds 15 days)';
      detail = 'Under Shafii madhab, bleeding beyond 15 days is classified as Istihadah (irregular bleeding). You must perform ghusl and resume all prayers and fasting.';

  } else {
    status = 'suci';
    statusMsg = 'Currently Suci (Pure)';
    detail = 'You are in a state of purity. All prayers, fasting, and ibadah are in full effect.';

  const rules = [
    { q: 'What is the maximum duration of haid?', a: '15 days (Shafii). If bleeding continues past Day 15, it is Istihadah.' },

    { q: 'When can I perform ghusl?', a: 'Once bleeding fully stops and you confirm purity (white discharge or complete dryness), perform ghusl immediately.' },

// HEALTH REPORT
// ============================================================
function HealthReportSheet({ onClose }) {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [patterns, setPatterns] = useState(null);

  useEffect(() => {
    Promise.all([gasCall('getPeriodLogs'), gasCall('getCycleAnalysis'), gasCall('getSymptomPatterns')]).then(([logs, analysis, syms]) => {
      if (logs.success && analysis.success) setData({ logs: logs.data, analysis: analysis.data });
      if (syms.success) setPatterns(syms.data);
      setLoading(false);
    });
  }, []);

  const printReport = () => { window.print(); };

  if (loading) return (
    <div className="overlay" onClick={e => e.target.classList.contains('overlay') && onClose()}>
      <div className="bottom-sheet"><div className="sheet-handle"/>
        <div style={{padding:'40px',textAlign:'center'}}><div className="spinner" style={{margin:'0 auto'}}/></div>
      </div>
    </div>
  );

  const a = data && data.analysis;
  const logs = data && data.logs || [];
  const now = new Date();
  const sixMonthsAgo = new Date(now.getTime() - 180 * 86400000);
  const recentLogs = logs.filter(l => new Date(l.start_date) >= sixMonthsAgo);

  const allDurations = recentLogs.map(l => parseInt(l.duration)||0).filter(d=>d>0);
  const avgDuration = allDurations.length > 0 ? Math.round(allDurations.reduce((s,d)=>s+d,0)/allDurations.length) : 0;
  const minCycle = a && a.validCycles && a.validCycles.length > 0 ? Math.min(...a.validCycles) : 0;
  const maxCycle = a && a.validCycles && a.validCycles.length > 0 ? Math.max(...a.validCycles) : 0;

  const symCount = patterns && patterns.symptomCount || {};
  const topSyms = Object.entries(symCount).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const totalDays = recentLogs.reduce((s,l)=>s+(parseInt(l.duration)||0),0);

  return (
    <div className="overlay" onClick={e => e.target.classList.contains('overlay') && onClose()}>
      <div className="bottom-sheet">
        <div className="sheet-handle"/>
        <div className="sheet-header">
          <div className="sheet-title">📊 Health Report</div>
          <div className="sheet-date">For your doctor — last 6 months</div>
        </div>
        <div style={{padding:'16px 20px 20px'}}>
          <div className="health-report">
            <div className="report-header">
              <div className="report-title">Cycle Health Report</div>
              <div className="report-sub">Generated {formatDateMY(todayStr())} · Last {recentLogs.length} cycles</div>
            </div>

            <div style={{marginBottom:'16px'}}>
              <div style={{fontSize:'11px',fontWeight:'700',color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'0.7px',marginBottom:'8px'}}>Cycle Summary</div>
              {[
                ['Average cycle length', a ? a.avgCycle + ' days' : '—'],
                ['Shortest cycle', minCycle ? minCycle + ' days' : '—'],
                ['Longest cycle', maxCycle ? maxCycle + ' days' : '—'],
                ['Average bleeding duration', avgDuration ? avgDuration + ' days' : '—'],
                ['Cycle stability', a ? (a.isStable ? '✓ Stable' : '⚠ Irregular') : '—'],
                ['Variance', a ? a.variance + ' days' : '—'],
                ['Total cycles recorded', logs.length + ''],
              ].map(([l,v]) => (
                <div key={l} className="report-row"><span className="report-label">{l}</span><span className="report-value">{v}</span></div>
              ))}
            </div>

            {topSyms.length > 0 && (
              <div style={{marginBottom:'16px'}}>
                <div style={{fontSize:'11px',fontWeight:'700',color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'0.7px',marginBottom:'8px'}}>Recurring Symptoms</div>
                {topSyms.map(([sym,count]) => (
                  <div key={sym} className="report-bar-row">
                    <div className="report-bar-label">
                      <span style={{fontSize:'12px',color:'var(--text)'}}>{sym}</span>
                      <span style={{fontSize:'12px',color:'var(--text-muted)'}}>{count} times</span>
                    </div>
                    <div className="report-bar">
                      <div className="report-bar-fill" style={{width:`${Math.min(100,(count/totalDays)*100*5)}%`}}/>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {recentLogs.length > 0 && (
              <div>
                <div style={{fontSize:'11px',fontWeight:'700',color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'0.7px',marginBottom:'8px'}}>Period History</div>
                {recentLogs.slice(0,6).map((l,i) => (
                  <div key={i} className="report-row">
                    <span className="report-label">{formatDateShort(l.start_date)} – {formatDateShort(l.end_date)}</span>
                    <span className="report-value">{l.duration} days{l.cycle_length ? ' · ' + l.cycle_length + 'd cycle' : ''}{l.is_outlier==='true' ? ' ⚠' : ''}</span>
                  </div>
                ))}
              </div>
            )}
          </div>

          <div className="btn-row" style={{marginTop:'16px',padding:'0'}}>
            <button className="btn btn-secondary" onClick={onClose}>Close</button>
            <button className="btn btn-primary" onClick={printReport}>Print / Save PDF</button>
          </div>
          <div style={{fontSize:'11px',color:'var(--text-muted)',textAlign:'center',marginTop:'8px'}}>Tap "Print" then choose "Save as PDF" in your browser</div>
        </div>
      </div>
    </div>
  );
}

      </div>
    </div>
  );
}

// ============================================================
// SYMPTOM WARNINGS SHEET
// ============================================================
function SymptomWarningsSheet({ onClose }) {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [dismissed, setDismissed] = useState([]);

  useEffect(() => {
    gasCall('getSymptomPatterns').then(res => {
      if (res && res.success) setData(res.data);
      setLoading(false);
    });
  }, []);

  const iconMap = { cramping:'😣', heavy_flow:'🩸', cycle_change:'📊', irregular:'⚠️' };

  return (
    <div className="overlay" onClick={e => e.target.classList.contains('overlay') && onClose()}>
      <div className="bottom-sheet">
        <div className="sheet-handle"/>
        <div className="sheet-header">
          <div className="sheet-title">🩺 Health Patterns</div>
          <div className="sheet-date">Based on your logged data</div>
        </div>
        <div style={{padding:'16px 20px 20px'}}>
          {loading ? <div style={{textAlign:'center',padding:'20px'}}><div className="spinner" style={{margin:'0 auto'}}/></div> :
           !data || data.cycles < 3 ? (
            <div className="empty-state">
              <div className="empty-icon">🩺</div>
              <div className="empty-title">Not enough data yet</div>
              <div className="empty-sub">Log at least 3 full cycles to see health pattern analysis</div>
            </div>
          ) : data.warnings.filter(w=>!dismissed.includes(w.type)).length === 0 ? (
            <div style={{textAlign:'center',padding:'20px'}}>
              <div style={{fontSize:'36px',marginBottom:'12px'}}>✅</div>
              <div style={{fontFamily:'DM Serif Display',fontSize:'18px',color:'var(--green)',marginBottom:'6px'}}>No concerns detected</div>
              <div style={{fontSize:'13px',color:'var(--text-muted)'}}>Based on {data.cycles} cycles of data</div>
            </div>
          ) : (
            <>
              <div style={{fontSize:'13px',color:'var(--text-light)',marginBottom:'14px',lineHeight:'1.6'}}>These patterns have been detected in your logged data. They are not diagnoses — share them with your doctor if you have concerns.</div>
              {data.warnings.filter(w=>!dismissed.includes(w.type)).map(w => (
                <div key={w.type} className={`warning-card ${w.severity}`}>
                  <div className="warning-icon">{iconMap[w.type] || '⚠️'}</div>
                  <div style={{flex:1}}>
                    <div className="warning-text">{w.msg}</div>
                    <div className="warning-dismiss" onClick={()=>setDismissed(p=>[...p,w.type])}>Dismiss ✕</div>
                  </div>
                </div>
              ))}
            </>
          )}
          <div style={{background:'var(--cream)',borderRadius:'10px',padding:'10px 14px',marginTop:'12px',fontSize:'12px',color:'var(--text-muted)',lineHeight:'1.6'}}>
            ℹ️ Pattern analysis requires a minimum of 3 logged cycles. More data improves accuracy.
          </div>
        </div>
      </div>
    </div>
  );
}

// ============================================================
// PROFILE TAB
// ============================================================
function ProfileTab({ settings, onDataChange, onShowHelp }) {
  const [showChangePin, setShowChangePin] = useState(false);
  const [showPregnancy, setShowPregnancy] = useState(false);
  const [showRamadan, setShowRamadan] = useState(false);
  const [showEditName, setShowEditName] = useState(false);
  const [showCycleSettings, setShowCycleSettings] = useState(false);
  const [showNifasConfirm, setShowNifasConfirm] = useState(false);
  const [showPurity, setShowPurity] = useState(false);
  const [showReport, setShowReport] = useState(false);
  const [showDates, setShowDates] = useState(false);
  const [showRamadanForecast, setShowRamadanForecast] = useState(false);
  const [showWarnings, setShowWarnings] = useState(false);
  const [dashData, setDashData] = useState(null);

  useEffect(() => {
    gasCall('getDashboardData').then(r => { if (r && r.success) setDashData(r.data); });
  }, []);
  const [oldPin, setOldPin] = useState('');
  const [newPin, setNewPin] = useState('');
  const [confirmNewPin, setConfirmNewPin] = useState('');
  const [lmpDate, setLmpDate] = useState('');
  const [deliveryDate, setDeliveryDate] = useState(todayStr());
  const [name, setName] = useState(settings ? settings.user_name || '' : '');
  const [cycleMin, setCycleMin] = useState(settings ? settings.cycle_min || '21' : '21');
  const [cycleMax, setCycleMax] = useState(settings ? settings.cycle_max || '35' : '35');
  const [ramadanYear, setRamadanYear] = useState(new Date().getFullYear().toString());
  const [ramadanMula, setRamadanMula] = useState('');
  const [ramadanTamat, setRamadanTamat] = useState('');
  const [ramadanList, setRamadanList] = useState([]);
  const [saving, setSaving] = useState(false);
  const [pinError, setPinError] = useState('');
  const [toast, setToast] = useState('');

  const [toastType, setToastType] = useState('');
  const showToast = (msg, type) => { setToast(msg); setToastType(type || ''); setTimeout(() => setToast(''), 2400); };

  useEffect(() => {
    gasCall('getPuasaData').then(r => {
      if (r && r.success) setRamadanList(r.data.ramadan || []);
    });
  }, []);

  const isPregnant = settings && (settings.pregnancy_status === 'pregnant');
  const isNifas = settings && (settings.pregnancy_status === 'nifas');

  const savePin = async () => {
    setPinError('');
    if (newPin !== confirmNewPin) { setPinError('New PIN does not match'); return; }
    if (newPin.length < 4) { setPinError('PIN must be at least 4 digits'); return; }
    setSaving(true);
    const res = await gasCall('changePin', { oldPin, newPin });
    setSaving(false);
    if (res && res.success) { setShowChangePin(false); setOldPin(''); setNewPin(''); setConfirmNewPin(''); showToast('PIN changed successfully', 'success'); }
    else setPinError(res ? res.error || 'Failed' : 'Failed');
  };

  const savePregnancy = async () => {
    if (!lmpDate) return;
    setSaving(true);
    await gasCall('activatePregnancy', { lmpDate });
    setSaving(false);
    setShowPregnancy(false);
    onDataChange && onDataChange();
    showToast('Pregnancy mode activated 🤰', 'success');
  };

  const confirmEndPregnancy = async () => {
    setSaving(true);
    await gasCall('endPregnancy', { deliveryDate });
    setSaving(false);
    setShowNifasConfirm(false);
    onDataChange && onDataChange();
    showToast('Postnatal mode activated 🌙', 'success');
  };

  const endNifasNow = async () => {
    setSaving(true);
    await gasCall('endNifas');
    setSaving(false);
    onDataChange && onDataChange();
    showToast('Returned to normal mode ✓', 'success');
  };

  const saveName = async () => {
    setSaving(true);
    await gasCall('updateSetting', { key: 'user_name', value: name });
    setSaving(false);
    setShowEditName(false);
    onDataChange && onDataChange();
    showToast('Name saved ✓', 'success');
  };

  const saveCycleSettings = async () => {
    setSaving(true);
    await gasCall('updateSettings', { cycle_min: cycleMin, cycle_max: cycleMax });
    setSaving(false);
    setShowCycleSettings(false);
    onDataChange && onDataChange();
    showToast('Cycle settings saved ✓', 'success');
  };

  const saveRamadan = async () => {
    if (!ramadanMula || !ramadanTamat) return;
    setSaving(true);
    await gasCall('saveRamadanDate', { tahun: ramadanYear, tarikh_mula: ramadanMula, tarikh_tamat: ramadanTamat });
    setSaving(false);
    const r = await gasCall('getPuasaData');
    if (r && r.success) setRamadanList(r.data.ramadan || []);
    showToast('Ramadan dates saved ✓', 'success');
  };

  const handleLogout = () => {
    clearSession();
    window.location.reload();
  };

  return (
    <div className="page-content">
      <div className="app-header">
        <div className="header-logo">👤 <span style={{fontSize:'16px',fontFamily:'DM Sans'}}>Profile & Settings</span></div>
      </div>

      {/* PROFIL */}
      <div className="profile-section">
        <div className="profile-section-header">Profile</div>
        <div className="profile-item" style={{borderRadius:'var(--radius-sm)'}} onClick={() => setShowEditName(true)}>
          <div className="pi-icon" style={{background:'var(--rose-pale)'}}>👤</div>
          <div className="pi-label">Name</div>
          <div className="pi-value">{settings && settings.user_name || '-'}</div>
          <div className="pi-arrow">›</div>
        </div>
      </div>

      {/* KITARAN */}
      <div className="profile-section">
        <div className="profile-section-header">Cycle Settings</div>
        <div className="profile-item" style={{borderRadius:'var(--radius-sm)'}} onClick={() => setShowCycleSettings(true)}>
          <div className="pi-icon" style={{background:'var(--rose-pale)'}}>⚙️</div>
          <div className="pi-label">Cycle Limits</div>
          <div className="pi-value">{settings ? `${settings.cycle_min}–${settings.cycle_max} days` : '21–35 days'}</div>
          <div className="pi-arrow">›</div>
        </div>
      </div>

      {/* RAMADAN */}
      <div className="profile-section">
        <div className="profile-section-header">Ramadan</div>
        <div className="profile-item" style={{borderRadius:'var(--radius-sm)'}} onClick={() => setShowRamadan(true)}>
          <div className="pi-icon" style={{background:'var(--green-light)'}}>🌙</div>
          <div className="pi-label">Ramadan Dates</div>
          <div className="pi-value">{ramadanList.length} year(s) set</div>
          <div className="pi-arrow">›</div>
        </div>
      </div>

      {/* KEHAMILAN */}
      <div className="profile-section">
        <div className="profile-section-header">Pregnancy Mode</div>
        {!isPregnant && !isNifas && (
          <div className="profile-item" style={{borderRadius:'var(--radius-sm)'}} onClick={() => setShowPregnancy(true)}>
            <div className="pi-icon" style={{background:'var(--rose-pale)'}}>🤰</div>
            <div className="pi-label">Confirm Pregnancy</div>
            <div className="pi-value">Normal</div>
            <div className="pi-arrow">›</div>
          </div>
        )}
        {isPregnant && (
          <div className="profile-item" style={{borderRadius:'var(--radius-sm)'}}>
            <div className="pi-icon" style={{background:'var(--rose-pale)'}}>🤰</div>
            <div className="pi-label">Status: Pregnant</div>
            <button className="btn btn-danger btn-sm" onClick={() => setShowNifasConfirm(true)}>End Pregnancy</button>
          </div>
        )}
        {isNifas && (
          <div className="profile-item" style={{borderRadius:'var(--radius-sm)'}}>
            <div className="pi-icon" style={{background:'var(--plum-light)'}}>🌙</div>
            <div className="pi-label">Status: Postnatal</div>
            <button className="btn btn-outline btn-sm" onClick={endNifasNow}>End Postnatal</button>
          </div>
        )}
      </div>

      {/* KESELAMATAN */}
      <div className="profile-section">
        <div className="profile-section-header">Security</div>
        <div className="profile-item" style={{borderRadius:'var(--radius-sm) var(--radius-sm) 0 0'}} onClick={() => setShowChangePin(true)}>
          <div className="pi-icon" style={{background:'var(--gold-light)'}}>🔒</div>
          <div className="pi-label">Change PIN</div>
          <div className="pi-arrow">›</div>
        </div>
        <div className="profile-item" style={{borderRadius:'0 0 var(--radius-sm) var(--radius-sm)'}} onClick={handleLogout}>
          <div className="pi-icon" style={{background:'var(--red-light)'}}>🚪</div>
          <div className="pi-label" style={{color:'var(--red)'}}>Log Out</div>
          <div className="pi-arrow">›</div>
        </div>
      </div>

      {/* NEW FEATURES */}
      <div className="profile-section">
        <div className="profile-section-header">Cycle Intelligence</div>
        <div className="profile-item" style={{borderRadius:'var(--radius-sm) var(--radius-sm) 0 0'}} onClick={() => setShowPurity(true)}>
          <div className="pi-icon" style={{background:'#e8eeff'}}>📿</div>
          <div className="pi-label">Purity Guide</div>
          <div className="pi-value">Shafi{"'"}</div>
          <div className="pi-arrow">›</div>
        </div>
        <div className="profile-item" style={{borderRadius:'0'}} onClick={() => setShowWarnings(true)}>
          <div className="pi-icon" style={{background:'var(--orange-light)'}}>🩺</div>
          <div className="pi-label">Health Patterns</div>
          <div className="pi-value">Symptom analysis</div>
          <div className="pi-arrow">›</div>
        </div>
        <div className="profile-item" style={{borderRadius:'0'}} onClick={() => setShowReport(true)}>
          <div className="pi-icon" style={{background:'var(--cream-dark)'}}>📊</div>
          <div className="pi-label">Health Report</div>
          <div className="pi-value">For your doctor</div>
          <div className="pi-arrow">›</div>
        </div>
        <div className="profile-item" style={{borderRadius:'0'}} onClick={() => setShowDates(true)}>
          <div className="pi-icon" style={{background:'var(--rose-pale)'}}>📅</div>
          <div className="pi-label">Important Dates</div>
          <div className="pi-value">Cycle predictions</div>
          <div className="pi-arrow">›</div>
        </div>
        <div className="profile-item" style={{borderRadius:'0 0 var(--radius-sm) var(--radius-sm)'}} onClick={() => setShowRamadanForecast(true)}>
          <div className="pi-icon" style={{background:'var(--green-light)'}}>🌙</div>
          <div className="pi-label">Ramadan Forecast</div>
          <div className="pi-value">Period prediction</div>
          <div className="pi-arrow">›</div>
        </div>
      </div>

      {/* HELP */}
      <div className="profile-section">
        <div className="profile-section-header">Support</div>
        <div className="profile-item" style={{borderRadius:'var(--radius-sm)'}} onClick={() => onShowHelp && onShowHelp()}>
          <div className="pi-icon" style={{background:'var(--rose-pale)'}}>❓</div>
          <div className="pi-label">Help & Glossary</div>
          <div className="pi-value">Terms explained</div>
          <div className="pi-arrow">›</div>
        </div>

      {/* ABOUT */}
      <div style={{textAlign:'center',padding:'20px',color:'var(--text-muted)',fontSize:'12px'}}>
        CycleTrack v1.0 · Built with ❤️

      {/* MODALS */}
      {showEditName && (
        <div className="overlay" onClick={e => e.target.classList.contains('overlay') && setShowEditName(false)}>
          <div className="bottom-sheet">
            <div className="sheet-handle"/>
            <div className="sheet-header"><div className="sheet-title">Name</div></div>
            <div className="sheet-body">
              <div className="input-group">
                <label className="input-label">Your name</label>
                <input className="input-field" value={name} onChange={e => setName(e.target.value)} placeholder="Name..." />
              </div>
              <div className="btn-row">
                <button className="btn btn-secondary" onClick={() => setShowEditName(false)}>Cancel</button>
                <button className="btn btn-primary" onClick={saveName} disabled={saving}>{saving ? '...' : 'Save'}</button>
              </div>
            </div>
          </div>
        </div>

        <div className="overlay" onClick={e => e.target.classList.contains('overlay') && setShowCycleSettings(false)}>

            <div className="sheet-header"><div className="sheet-title">Cycle Settings</div></div>
            <div className="sheet-body">
              <div className="input-group">
                <label className="input-label">Had Minimum Cycle (days)</label>
                <input className="input-field" type="number" min="15" max="25" value={cycleMin} onChange={e => setCycleMin(e.target.value)} />

              <div className="input-group">
                <label className="input-label">Had Maximum Cycle (days)</label>

              <div className="btn-row">
                <button className="btn btn-secondary" onClick={() => setShowCycleSettings(false)}>Cancel</button>
                <button className="btn btn-primary" onClick={saveCycleSettings} disabled={saving}>{saving ? '...' : 'Save'}</button>

                  <div key={r.id} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'8px 0',borderBottom:'1px solid var(--cream-dark)'}}>
                    <span style={{fontWeight:'600',color:'var(--text)'}}>{r.tahun}</span>
                    <span style={{fontSize:'12px',color:'var(--text-muted)'}}>{formatDateShort(r.tarikh_mula)} — {formatDateShort(r.tarikh_tamat)}</span>

                  <label className="input-label">Start Date</label>
                  <input className="input-field" type="date" value={ramadanMula} onChange={e => setRamadanMula(e.target.value)} />
                </div>
                <div className="input-group">
                  <label className="input-label">End Date</label>
                  <input className="input-field" type="date" value={ramadanTamat} onChange={e => setRamadanTamat(e.target.value)} />

            </div>
          </div>
        </div>
      )}

      {showPregnancy && (
        <div className="overlay" onClick={e => e.target.classList.contains('overlay') && setShowPregnancy(false)}>
          <div className="bottom-sheet">
            <div className="sheet-handle"/>
            <div className="sheet-header">
              <div className="sheet-title">🤰 Confirm Kehamilan</div>
              <div className="sheet-date">Naegele Rule: LMP + 280 days</div>
            </div>
            <div className="sheet-body">
              <div className="input-group">
                <label className="input-label">Tarikh Period Terakhir (LMP)</label>
                <input className="input-field" type="date" value={lmpDate} onChange={e => setLmpDate(e.target.value)} />
              </div>
              {lmpDate && (
                <div style={{background:'var(--rose-pale)',borderRadius:'10px',padding:'12px',marginBottom:'14px',fontSize:'13px',color:'var(--rose-dark)'}}>
                  🗓️ Expected Delivery Date (EDD):<br/>
                  <strong style={{fontSize:'16px'}}>{formatDateMY(addDays(lmpDate, 280))}</strong>
                </div>
              )}
              <div style={{background:'var(--orange-light)',borderRadius:'10px',padding:'10px 12px',marginBottom:'14px',fontSize:'12px',color:'var(--orange)'}}>
                ⚠️ All cycle predictions will be frozen while pregnancy mode is active.
              </div>
              <div className="btn-row">
                <button className="btn btn-secondary" onClick={() => setShowPregnancy(false)}>Cancel</button>
                <button className="btn btn-primary" onClick={savePregnancy} disabled={saving || !lmpDate}>{saving ? '...' : 'Confirm'}</button>
              </div>
            </div>
          </div>
        </div>
      )}

      {showNifasConfirm && (
        <div className="overlay" onClick={e => e.target.classList.contains('overlay') && setShowNifasConfirm(false)}>
          <div className="bottom-sheet">
            <div className="sheet-handle"/>
            <div className="sheet-header">
              <div className="sheet-title">🌙 End Pregnancy</div>
              <div className="sheet-date">Masuk Mod Nifas (max 60 days)</div>
            </div>
            <div className="sheet-body">
              <div className="input-group">
                <label className="input-label">Delivery Date</label>
                <input className="input-field" type="date" value={deliveryDate} onChange={e => setDeliveryDate(e.target.value)} />
              </div>
              {deliveryDate && (
                <div style={{background:'var(--plum-light)',borderRadius:'10px',padding:'12px',marginBottom:'14px',fontSize:'13px',color:'var(--plum)'}}>
                  🌙 Mod nifas seto: <strong>{formatDateMY(addDays(deliveryDate, 60))}</strong>
                </div>
              )}
              <div className="btn-row">
                <button className="btn btn-secondary" onClick={() => setShowNifasConfirm(false)}>Cancel</button>
                <button className="btn btn-primary" onClick={confirmEndPregnancy} disabled={saving}>{saving ? '...' : 'Confirm'}</button>
              </div>
            </div>
          </div>
        </div>
      )}

      {showPurity && <PurityGuideSheet dashData={dashData} onClose={() => setShowPurity(false)} />}
      {showReport && <HealthReportSheet onClose={() => setShowReport(false)} />}
      {showDates && <ImportantDatesSheet onClose={() => setShowDates(false)} />}
      {showRamadanForecast && <RamadanForecastSheet ramadanList={ramadanList} onClose={() => setShowRamadanForecast(false)} />}
      {showWarnings && <SymptomWarningsSheet onClose={() => setShowWarnings(false)} />}
      {toast && <Toast msg={toast} type={toastType} onDone={() => setToast('')} />}
    </div>
  );
}
